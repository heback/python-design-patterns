<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 패턴 학습 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<style>/* 탐구 학습지 화면 스타일. '학습활동 자료 디자인 시스템'(상아색 종이 · 남색 글자 · 금빛 한 줄 장식)의 토큰을 따른다.
   색은 모두 토큰이고, 다크 모드는 토큰만 바꾼다. 아래쪽 '옛 이름' 줄은 pyrun.css(편집기)가 쓰는 변수를 새 토큰으로 이어 준다. */
:root {
  --paper: #f6f3ed; --panel: #fffdfa; --panel-sunk: #f1ede5;
  --ink: #1a2332; --ink-soft: #384355; --dim: #5a6372;
  --line: #dcd5c6; --line-control: #8c8372;
  --accent: #1f4f78; --accent-strong: #163a5a; --accent-soft: #e8eff5; --accent-line: #b9cde0; --on-accent: #ffffff;
  --gold: #d4ae55; --gold-ink: #86621a; --gold-soft: #f6ecd6; --gold-line: #e4d2a4;
  --ok: #1d6a47; --ok-soft: #e6f1ea; --ok-line: #b6d6c3;
  --warn: #7f5a12; --warn-soft: #f8efd9;
  --bad: #a03a1c; --bad-soft: #f8e7e0;
  --navy: #16202e; --on-navy: #f3efe6; --navy-muted: #b9c3d3; --navy-line: #6a778c; --focus-on-navy: #f0cd73;
  --code-surface: #fcfbf8;
  --tok-comment: #6a737d; --tok-keyword: #a3195b; --tok-string: #1f6b3a; --tok-func: #6639ba;
  --tok-class: #8a4b08; --tok-number: #0b5c99; --tok-deco: #b3561d;
  --shadow-card: 0 1px 2px rgba(26, 35, 50, .05), 0 14px 30px -18px rgba(26, 35, 50, .22);
  --shadow-raised: 0 2px 4px rgba(26, 35, 50, .06), 0 18px 36px -16px rgba(26, 35, 50, .3);
  --shadow-focus: 0 0 0 4px rgba(31, 79, 120, .14);
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-pill: 999px;
  --font-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-serif: "Noto Serif KR", "Nanum Myeongjo", AppleMyungjo, Batang, serif;
  --font-mono: "JetBrains Mono", "D2Coding", ui-monospace, Menlo, Consolas, monospace;
  /* 옛 이름(pyrun.css·코드 편집기가 쓴다) */
  --bg: var(--paper); --surface: var(--panel); --surface-2: var(--panel-sunk); --text: var(--ink); --muted: var(--dim);
  --border: var(--line); --accent-text: var(--on-accent); --code-bg: var(--code-surface); --code-text: var(--ink);
  --radius: var(--radius-lg); --mono: var(--font-mono); --font-code: var(--font-mono);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1622; --panel: #172131; --panel-sunk: #1d2a3d;
    --ink: #ece8df; --ink-soft: #cfd5df; --dim: #9aa6b8;
    --line: #2a374b; --line-control: #55657d;
    --accent: #8fb8e0; --accent-strong: #b4d1ee; --accent-soft: #1b2b40; --accent-line: #2f4764; --on-accent: #0f1622;
    --gold-ink: #e0bf6a; --gold-soft: #2a2415; --gold-line: #4a3f22;
    --ok: #7fcf9f; --ok-soft: #15281f; --ok-line: #2d5440; --warn: #e0b45a; --warn-soft: #2a2415;
    --bad: #f0907a; --bad-soft: #35201b;
    --navy: #0a111b; --code-surface: #131c2a;
    --tok-comment: #8b949e; --tok-keyword: #ff7b9c; --tok-string: #a5d6a7; --tok-func: #d2a8ff;
    --tok-class: #f0c674; --tok-number: #79c0ff; --tok-deco: #ffa657;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .3); --shadow-raised: 0 18px 36px -16px rgba(0, 0, 0, .6); --shadow-focus: 0 0 0 4px rgba(143, 184, 224, .2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1622; --panel: #172131; --panel-sunk: #1d2a3d;
  --ink: #ece8df; --ink-soft: #cfd5df; --dim: #9aa6b8;
  --line: #2a374b; --line-control: #55657d;
  --accent: #8fb8e0; --accent-strong: #b4d1ee; --accent-soft: #1b2b40; --accent-line: #2f4764; --on-accent: #0f1622;
  --gold-ink: #e0bf6a; --gold-soft: #2a2415; --gold-line: #4a3f22;
  --ok: #7fcf9f; --ok-soft: #15281f; --ok-line: #2d5440; --warn: #e0b45a; --warn-soft: #2a2415;
  --bad: #f0907a; --bad-soft: #35201b;
  --navy: #0a111b; --code-surface: #131c2a;
  --tok-comment: #8b949e; --tok-keyword: #ff7b9c; --tok-string: #a5d6a7; --tok-func: #d2a8ff;
  --tok-class: #f0c674; --tok-number: #79c0ff; --tok-deco: #ffa657;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .3); --shadow-raised: 0 18px 36px -16px rgba(0, 0, 0, .6); --shadow-focus: 0 0 0 4px rgba(143, 184, 224, .2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.75 var(--font-sans); word-break: keep-all; overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
::selection { background: #f1dfae; color: #1a2332; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent-strong); }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, pre, .mono { font-family: var(--font-mono); word-break: normal; }
code { background: var(--panel-sunk); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; font-size: .88em; }
pre {
  background: var(--code-surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 18px;
  overflow-x: auto; font-size: 13.5px; line-height: 1.65; margin: 12px 0;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
button { font: inherit; cursor: pointer; }
textarea, input, select { word-break: normal; }

/* 버튼 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
  border: 1px solid var(--line-control); background: var(--panel); color: var(--ink);
  padding: 6px 14px; border-radius: var(--radius-md); font: 600 13.5px/1.4 var(--font-sans);
  transition: background .15s, border-color .15s, color .15s; text-decoration: none;
}
.btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.btn.small { padding: 2px 10px; font-size: 12.5px; }
.btn.ghost { background: transparent; }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

/* 상단 바: 남색 바탕에 금빛 아래 선(저장 바 규칙) */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--navy); color: var(--on-navy); border-bottom: 2px solid var(--gold);
  padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; box-shadow: 0 8px 20px -10px rgba(10, 16, 28, .55);
}
.topbar h1 { display: flex; align-items: center; gap: 8px; font: 700 17px/1.3 var(--font-serif); margin: 0; letter-spacing: -.01em; color: var(--on-navy); }
.topbar .grow { flex: 1 1 20px; }
.topbar input.id {
  border: 1px solid var(--navy-line); background: #fff; color: #1a2332; border-radius: var(--radius-md);
  padding: 5px 10px; font: 500 14px var(--font-sans); width: 112px;
}
.topbar input.id.sm { width: 64px; }
.topbar input.id:focus-visible, .topbar .btn:focus-visible { outline: 2px solid var(--focus-on-navy); outline-offset: 2px; }
.topbar .btn { background: transparent; color: var(--on-navy); border-color: var(--navy-line); }
.topbar .btn:hover:not(:disabled) { background: rgba(255, 255, 255, .08); border-color: var(--navy-muted); color: var(--on-navy); }
.topbar .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--navy); }
.topbar .btn.primary:hover:not(:disabled) { background: #e3c070; border-color: #e3c070; color: var(--navy); }
.topbar .btn.danger:hover:not(:disabled) { background: rgba(255, 255, 255, .08); border-color: #ff9b7a; color: #ffc9b5; }
.topbar .lead { color: var(--navy-muted); font-size: 13px; }
.savestate { display: inline-flex; align-items: center; font-size: 13px; color: var(--navy-muted); }
.savestate.dirty { color: #ffd9a3; font-weight: 600; }
.savestate.clean { color: #bfe8cf; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 24px 0; max-width: 1100px; margin: 0 auto; }
.tab {
  flex: 1 1 140px; text-align: left; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); color: var(--ink); transition: border-color .15s, background .15s;
}
.tab:hover { border-color: var(--accent-line); }
.tab small { display: block; color: var(--dim); font-size: 12px; line-height: 1.4; }
.tab b { display: block; font-size: 14px; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { height: 5px; background: var(--panel-sunk); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }

main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 96px; }

/* 주 머리: 활동 시트 */
.hero {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-xl); padding: 28px 32px; margin-bottom: 20px;
  box-shadow: var(--shadow-card);
}
.hero .kicker { color: var(--gold-ink); font: 500 12.5px var(--font-mono); letter-spacing: .04em; }
.hero h2 {
  position: relative; margin: 4px 0 18px; padding-bottom: 14px; font: 700 28px/1.35 var(--font-serif); letter-spacing: -.015em; border-bottom: 1px solid var(--line);
}
.hero h2::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 56px; height: 3px; background: var(--gold); border-radius: 2px; }
.hero h3 { margin: 0 0 10px; font-size: 17px; }
.hero p { margin: 8px 0; }
.concept {
  display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: var(--radius-pill);
  padding: 2px 14px; font-weight: 700; font-size: 13.5px; margin-right: 8px;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: var(--radius-lg); padding: 14px 18px; }
.card h4 { margin: 0 0 6px; font-size: 14px; color: var(--accent); letter-spacing: .02em; }
.card ul { margin: 4px 0; padding-left: 20px; }
.card li { margin: 4px 0; }
li::marker { color: var(--gold-ink); }
.qtag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 0 9px; border-radius: var(--radius-pill); margin-right: 6px; }
.qtag.f { background: var(--accent-soft); color: var(--accent); }
.qtag.c { background: var(--ok-soft); color: var(--ok); }
.qtag.d { background: var(--gold-soft); color: var(--gold-ink); }
.pattern-links a { display: inline-block; margin: 2px 12px 2px 0; font-size: 14.5px; }

/* 단계 */
.stage { margin: 32px 0; }
.stage > header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 10px; position: sticky; top: 56px; background: var(--paper);
  padding: 8px 0; z-index: 5;
}
.stage .badge {
  background: var(--accent-soft); color: var(--accent); border-radius: var(--radius-pill); padding: 3px 14px; font-weight: 700; font-size: 14px;
}
.stage h3 { margin: 0; font-size: 18px; }
.stage .min { color: var(--dim); font: 500 12.5px var(--font-mono); }
.stage .intro { color: var(--ink-soft); margin: 0 0 12px; }
.item {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 22px; margin: 14px 0;
  box-shadow: var(--shadow-card);
}
.item.done { border-color: var(--ok-line); }
.item .q { margin: 0 0 10px; font-weight: 600; }
.item .q .no {
  display: inline-block; color: var(--accent); background: var(--accent-soft); border-radius: var(--radius-sm); padding: 0 8px; margin-right: 8px;
  font: 700 12.5px/1.7 var(--font-mono);
}
.item .hint { color: var(--dim); font-size: 14px; margin: 0 0 8px; }
.item.info { background: var(--panel-sunk); box-shadow: none; }
.item.info .q { font-weight: 400; }
textarea, input[type="text"], select {
  width: 100%; border: 1px solid var(--line-control); border-radius: var(--radius-md); background: var(--panel); color: var(--ink);
  font: inherit; font-size: 15px; padding: 8px 12px; line-height: 1.6; transition: border-color .15s, box-shadow .15s;
}
textarea::placeholder, input::placeholder { color: var(--dim); }
textarea { resize: vertical; min-height: 46px; overflow: hidden; }
textarea.code { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.55; min-height: 160px; tab-size: 4; white-space: pre; overflow: auto; background: var(--code-surface); }
textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); box-shadow: var(--shadow-focus); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 18px; height: 18px; }
.opts { display: grid; gap: 8px; margin: 8px 0 12px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-md); cursor: pointer; background: var(--panel); }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 5px; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); }
.why { margin-top: 8px; }
.why label { font-size: 13px; color: var(--gold-ink); font-weight: 500; display: block; margin-bottom: 4px; }
.tbl-wrap { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14.5px; }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
table.grid thead th { background: var(--panel-sunk); color: var(--ink-soft); font-size: 12.5px; letter-spacing: .02em; }
table.grid tbody th { background: var(--panel-sunk); width: 17%; font-weight: 600; }
table.grid td textarea { font-size: 14px; min-height: 56px; }
.sortrow { display: grid; grid-template-columns: 1fr 200px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.sortrow:last-child { border-bottom: 0; }
.triple { display: grid; grid-template-columns: 1fr 1fr 1fr 30px; gap: 8px; margin: 6px 0; align-items: center; }
.triple .arrow { text-align: center; color: var(--dim); }
.listrow { display: grid; grid-template-columns: 26px 1fr 30px; gap: 8px; margin: 6px 0; align-items: center; }
.listrow .n { color: var(--accent); text-align: right; font: 700 13px var(--font-mono); }
.xbtn { border: 0; background: none; color: var(--dim); font-size: 18px; line-height: 1; }
.xbtn:hover { color: var(--bad); }
.scale-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.scale-row:last-child { border-bottom: 0; }
.scale-pts { display: flex; gap: 6px; }
.scale-pts label { display: block; }
.scale-pts input { position: absolute; opacity: 0; }
.scale-pts span { display: block; width: 36px; text-align: center; padding: 3px 0; border: 1px solid var(--line-control); border-radius: var(--radius-md); cursor: pointer; background: var(--panel); }
.scale-pts input:checked + span { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.scale-pts input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.scale-ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dim); }
.addbtn { margin-top: 4px; }
.filled-mark { float: right; display: inline-flex; align-items: center; font-size: 12.5px; color: var(--dim); }
.item.done .filled-mark { color: var(--ok); font-weight: 600; }

/* 정답 표시 상자: 한 겹 머리선 + 연한 바탕. 왼쪽 색 띠는 쓰지 않고 첫 줄 낱말로 알린다. */
.val { white-space: pre-wrap; word-break: break-word; }
.val.empty, .empty { color: var(--dim); font-style: italic; }
.val-code { margin: 4px 0; }
table.ro { border-collapse: collapse; width: 100%; font-size: 14.5px; }
table.ro th, table.ro td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; text-align: left; white-space: pre-wrap; }
table.ro.prog th, table.ro.prog td { white-space: nowrap; }
table.ro th { background: var(--panel-sunk); color: var(--ink-soft); font-size: 12.5px; letter-spacing: .02em; }
.pill { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 700; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.part { background: var(--gold-soft); color: var(--gold-ink); } .pill.none { background: var(--panel-sunk); color: var(--dim); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color: var(--on-navy); border: 1px solid var(--gold);
  padding: 9px 18px; border-radius: var(--radius-md); font-size: 14px; z-index: 50; opacity: 0; transition: opacity .25s; pointer-events: none;
}
.toast.on { opacity: .96; }
.lead { color: var(--ink-soft); }
details.fold { margin: 8px 0; }
details.fold > summary { cursor: pointer; font-weight: 600; color: var(--accent); }

/* 앞서 쓴 글 상자, 선택 문항 표시 */
.recall { background: var(--panel-sunk); border: 1px dashed var(--line-control); border-radius: var(--radius-md); padding: 10px 14px; margin: 0 0 12px; font-size: 14.5px; }
.recall .val { margin: 4px 0 0; white-space: pre-wrap; }
.recall .rl { color: var(--accent); font-weight: 600; }
.opt-tag { display: inline-block; border: 1px solid var(--line-control); color: var(--dim); border-radius: var(--radius-pill); padding: 0 8px; font-size: 12px; margin-right: 6px; font-weight: 500; }

/* 교사 로그인 · 진도 화면 */
[hidden] { display: none !important; }
.gate { max-width: 440px; margin: 16vh auto; text-align: center; padding: 0 16px; }
.gate h1 { font: 700 26px/1.4 var(--font-serif); }
.gate .err { color: var(--bad); margin-top: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-xl); padding: 20px 24px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
.panel h3 { margin: 0 0 8px; font-size: 17px; }
button.pct { border: 0; background: transparent; color: var(--accent); font: 700 13.5px var(--font-sans); cursor: pointer; padding: 2px 6px; border-radius: var(--radius-sm); text-decoration: underline; text-underline-offset: 3px; }
button.pct:hover { background: var(--accent-soft); }
button.pct:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.pct small { display: block; color: var(--dim); font-weight: 400; text-decoration: none; font-size: 11.5px; }
.dlg-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(22, 32, 46, .6); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; }
.dlg { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-xl); width: min(720px, 100%); max-height: 90vh; overflow: auto; padding: 18px 22px 20px; box-shadow: var(--shadow-raised); }
.dlg header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }

.token.number, .token.boolean { color: var(--tok-number, #0b5c99); }
.token.decorator { color: var(--tok-deco, #b3561d); }
.token.operator, .token.punctuation { color: var(--muted, #656d76); }

  background: var(--pr-bg); color: var(--pr-fg); border: 1px solid var(--border); border-radius: 8px;
  font: 13.5px/1.6 var(--pr-mono); white-space: pre; tab-size: 4;
}

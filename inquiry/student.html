  /* 호스트가 화면 맥락을 만들 때 쓰는 도구 */
  /* 노드의 글을 읽기 좋은 글로: 줄 번호·실행 결과·버튼·그림은 빼고, 화면 밖에 복제해 줄바꿈이 살아 있는 innerText 로 읽는다(visibility:hidden 이면 innerText 가 비므로 화면 밖으로만 치운다). */
  function readable(node, max) {
    const c = node.cloneNode(true);
    c.querySelectorAll(".pr-gutter, .pr-out, .pr-bar, .pr-hl, .copy, button, svg, script, style, textarea, input, select, .ms").forEach(n => n.remove());
    const box = el("div", { style: "position:absolute;left:-99999px;top:0;width:700px;pointer-events:none" }); box.append(c); document.body.append(box);
    const t = (box.innerText || "").replace(/\n{3,}/g, "\n\n").trim(); box.remove(); return t.slice(0, max);
  }
  /* 학생이 드래그해 고른 글(대화창 안에서 고른 것은 뺀다) */
  function selectedText() {
    const s = window.getSelection(); if (!s || s.isCollapsed) return "";
    const n = s.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement);
    if (n && n.closest && n.closest(".ai-panel")) return "";
    return String(s).trim().slice(0, 1500);
  }
  /* 화면 가운데에 가장 가까운(가운데를 지나면 0) 요소 */
  function nearestMid(nodes) {
    const mid = innerHeight / 2; let best = null, bd = Infinity;
    nodes.forEach(x => { const r = x.getBoundingClientRect(); const d = r.top <= mid && r.bottom >= mid ? 0 : Math.min(Math.abs(r.top - mid), Math.abs(r.bottom - mid)); if (d < bd) { bd = d; best = x; } });
    return best;
  }

  /* o = {getContext}. 교사가 켠 동안만 아이콘을 보인다. */
  function init(o) {
    if (started || typeof FB === "undefined") return; started = true;
    getContext = o.getContext; build();
    setInterval(() => { if (!panel.hidden) refreshCtx(); }, 1500);                // 화면을 옮기거나 글을 고르면 안내가 따라간다
    FB.watchAssistant(s => { enabled = !!(s && s.on); show(); }).catch(() => {});
  }
  return { init, readable, selectedText, nearestMid };
})();

<script>"use strict";
/* 학생용: 진도 자동 전달. 교사가 [진도 수집]을 켜 두었을 때만 동작하고, 켜져 있는 동안은 화면 위쪽에 항상 고지한다.
   전달하는 것: 로그인한 계정의 이름·이메일(학번·성명은 받지 않는다), 주차별 완료 문항 수·ID, 마지막으로 만진 문항, 활동 시간(화면이 보이고 최근 60초 안에 입력·스크롤·클릭이 있던 시간), 마지막 활동 시각.
   이 화면을 보고 있는지(FocusTrack: 탭 가림·창 포커스)와 벗어난 횟수·시간도 전달한다. 학생 고지 줄(updateBar)은 이 목록과 항상 같게 유지한다.
   전달하지 않는 것: 쓴 글의 내용(서버로 보내지 않는다. 브라우저에만 저장된다), 키 입력, 화면, 탭 전환.
   student.js 보다 먼저 실려서, 전역 S·CONTENT·LS_KEY 는 함수가 실제로 불릴 때 읽는다. */
const Mon = (() => {
  const IDLE_MS = 60000, BEAT_MS = 60000, MIN_GAP_MS = 10000;
  let monOn = false, monKnown = false, monAt = 0, ready = false, sending = false, again = false, barState = "";
  let lastSentAt = 0, lastSig = "", lastInput = 0, lastActiveAt = 0, lastTick = Date.now(), tickCount = 0;
  let activeMs = 0, started = false;
  const lastByWeek = {};
  const K_AMS = () => StudentAuth.key(LS_KEY + "-activeMs");     // 계정(uid)별 활동 시간
  const loggedIn = () => !!StudentAuth.get();
  /* 로그인 안내: 로그인 전에는 버튼, 후에는 계정과 로그아웃(공용 컴퓨터용) */
  function accountBits() {
    const u = StudentAuth.get(), msg = el("span", { class: "monmsg" });
    if (!u) return [msg, "먼저 학교 Google 계정으로 로그인해 주세요. ", el("button", { class: "qbtn", type: "button", onclick: async () => { msg.textContent = (await StudentAuth.login()) || ""; } }, ico("login"), "로그인")];
    return [el("span", { class: "monacct" }, u.email, " "), el("button", { class: "qbtn small", type: "button", onclick: () => StudentAuth.logout() }, "로그아웃")];
  }
  const wkOf = id => { const m = /^w(\d+)-/.exec(id); return m ? Number(m[1]) : 0; };

  /* ---------- 고지 줄 ---------- */
  function updateBar() {
    const b = $("#monbar"); if (!b) return;
    const show = typeof FB !== "undefined" && monKnown; b.hidden = !show; if (!show) return;      // 스위치 상태를 아직 모르면(불러오는 중·오프라인) 아무 말도 하지 않는다
    if (!monOn) {                                                                       // 수집이 중지된 상태도 학생에게 분명히 알린다(나중에 서로 다른 말이 나오지 않도록)
      b.className = "monbar off";
      b.replaceChildren(ico("pause_circle", "fill"), el("b", {}, "진도 수집이 중지된 상태예요. "),
        "지금은 읽은 곳·활동 시간·이 화면을 보고 있는지 같은 학습 활동 정보가 선생님께 전달되거나 서버에 기록되지 않아요" + (monAt ? ` (선생님이 ${stamp(new Date(monAt))}에 중지했어요)` : "") + ". AI 도우미를 쓸 때의 질문·답 기록은 이와 별개예요.");
      return;
    }
    b.className = "monbar" + (barState === "err" ? " err" : "");
    const st = !loggedIn() ? ""
      : barState === "err" ? "지금은 전달하지 못했어요(인터넷 연결을 확인해 주세요. 공부에는 영향이 없어요)."
      : lastSentAt ? "전달됨 " + stamp(new Date(lastSentAt)) : "";
    const stIco = barState === "err" ? ico("warning") : lastSentAt && loggedIn() ? ico("check_circle", "fill") : null;
    b.replaceChildren(ico("cell_tower"), el("b", {}, "진행 상황이 선생님께 자동으로 전달돼요. "),
      "어느 문항을 마쳤는지·지금 어느 문항을 하고 있는지·마지막 활동 시각·활동 시간(입력이나 스크롤이 있던 시간)·이 화면을 보고 있는지(다른 탭이나 창으로 옮겼는지)와 벗어난 횟수·시간이 로그인한 계정의 이름·이메일과 함께 전달돼요. "
      + "쓴 글의 내용과 키 입력, 화면은 보내지 않아요. ", ...accountBits(), el("span", { class: "monst" }, stIco, st));
  }

  /* ---------- 진도 ---------- */
  function snapshot() {
    const weeks = {};
    CONTENT.weeks.forEach(w => {
      const ids = []; let total = 0;
      for (const st of w.stages) for (const it of st.items) if (ANSWERABLE(it) && !it.optional) { total++; if (isAnswered(it, S.answers[it.id])) ids.push(it.id); }
      if (ids.length) weeks[w.n] = { n: ids.length, total, ids, last: lastByWeek[w.n] || ids[ids.length - 1] };
    });

  }
  async function send(force) {
    if (!monOn || !loggedIn() || typeof FB === "undefined") return;
    if (sending) { if (force) again = true; return; }                  // 앞 전송이 끝나면 최신 상태로 한 번 더 보낸다(버리면 서버가 옛 상태에 머문다)
    const weeks = snapshot(), sig = JSON.stringify(weeks) + "|" + FocusTrack.snapshot().view, now = Date.now();      // 화면 상태가 바뀐 것도 '바뀐 것'이다
    if (!force && now - lastSentAt < MIN_GAP_MS) return;
    if (!force && sig === lastSig && now - lastSentAt < BEAT_MS) return;   // 바뀐 게 없어도 1분마다 하트비트(조작이 없어도 보낸다 — 교사 화면이 '이 화면을 아직 열어 둔 상태'를 믿으려면 신호가 계속 와야 한다. 탭을 닫으면 끊긴다)
    sending = true;
    try {
      await FB.reportProgress({ weeks, activeMs, lastActiveAt: lastActiveAt || now, where: whereNow(), focus: FocusTrack.snapshot() });
      lastSig = sig; lastSentAt = Date.now(); barState = "ok"; ready = true;
    } catch (e) { barState = "err"; }
    sending = false; updateBar();
    if (again) { again = false; send(true); }
  }
  /* 지금 어디에 있는지(교사 표의 '마지막 활동 위치'). 마지막으로 만진 문항의 주차를 쓴다. */
  function whereNow() { const ks = Object.keys(lastByWeek); return ks.length ? "학습지 " + ks[ks.length - 1] + "주차" : "학습지"; }
  function tick() {
    const now = Date.now(), dt = now - lastTick; lastTick = now; tickCount++;
    if (document.visibilityState === "visible" && now - lastInput < IDLE_MS && dt < 5000) activeMs += dt;
    if (tickCount % 10 === 0) lsSet(K_AMS(), String(Math.round(activeMs)));

  }

  /* ---------- 바깥에서 부르는 함수 ---------- */
  function init() {
    if (typeof FB === "undefined" || started) return; started = true;
    ["pointerdown", "keydown", "input", "scroll", "wheel", "touchstart"].forEach(t =>
      addEventListener(t, () => { lastInput = lastActiveAt = Date.now(); }, { passive: true, capture: true }));
    setInterval(tick, 1000);

    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") send(true); });
    FB.watchMonitor(s => { const was = monOn; monKnown = s !== undefined; monAt = s && s.updatedAt && s.updatedAt.toMillis ? s.updatedAt.toMillis() : 0; monOn = !!(s && s.on); if (!monOn) { ready = false; lastSentAt = 0; } if (monOn && !was) send(true); updateBar(); }).catch(() => {});
    FocusTrack.onChange(() => send(true));      // 화면을 벗어나거나 돌아올 때 바로 알린다
    StudentAuth.onChange(() => { ready = false; lastSig = ""; activeMs = Number(lsGet(K_AMS())) || 0; updateBar(); send(true); });
    StudentAuth.init();
  }
  /* 문항을 만질 때마다(student.js renderItem) */
  function note(id) { lastByWeek[wkOf(id)] = id; lastInput = lastActiveAt = Date.now(); }
  /* 화면을 다시 그린 뒤 고지 줄을 맞춘다 */
  function refresh() { updateBar(); }
  return { init, note, refresh };
})();
</script>
<script>"use strict";
/* 학생용 앱. CONTENT(문항)는 빌드 때 주입된다. 정답·교사 메모는 학생용 빌드에 들어 있지 않다. */
const LS_KEY = "dp-inquiry-student";
let S = newState(), curWeek = 0, saveTimer = null;
let lsFailed = false;   // 브라우저 저장소가 막혔는가(boot 보다 먼저 선언)

(function boot() {
  const raw = lsGet(LS_KEY);
  if (raw) { try { const d = JSON.parse(raw); if (validState(d)) S = d; } catch (e) {} }
  curWeek = Number(lsGet(LS_KEY + "-week")) || 0;
  const hm = /^#w(\d)$/.exec(location.hash); if (hm) curWeek = Number(hm[1]) - 1;   // 첫 화면의 주차 카드에서 바로 들어오기
  if (!(curWeek >= 0 && curWeek < CONTENT.weeks.length)) curWeek = 0;
  initTheme();
  bindTop();
  render();
  initFb();
})();

function hasAnswers() { return Object.keys(S.answers).length > 0; }

function bindTop() {
  $("#btn-print").addEventListener("click", () => print());
  $("#btn-reset").addEventListener("click", () => {
    if (!confirm("이 브라우저에 있는 작성 내용을 모두 지우고 처음부터 시작합니다. 지운 내용은 복구할 수 없습니다. 계속할까요?")) return;
    S = newState(); persist(); render(); toast("초기화했습니다");
  });
}

function touch() {
  updateSaveState();
  clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400);
}
function persist() {
  S.saved = new Date().toISOString();
  const ok = lsSet(LS_KEY, JSON.stringify(S));
  updateSaveState(ok);
}
function updateSaveState(lsOk) {
  if (lsOk === false) lsFailed = true; else if (lsOk === true) lsFailed = false;
  const e = $("#savestate");
  if (lsFailed) { e.className = "savestate dirty"; e.replaceChildren(ico("warning"), "자동 저장이 막혀 있어요. 창을 닫으면 작성한 내용이 사라져요"); e.title = "브라우저가 저장소 사용을 막고 있습니다(사생활 보호 모드 등)."; }
  else if (!hasAnswers()) { e.className = "savestate"; e.textContent = "아직 작성한 내용이 없어요"; e.title = ""; }
  else { e.className = "savestate clean"; e.replaceChildren(ico("check_circle", "fill"), "이 브라우저에 자동 저장됨 " + stamp(S.saved ? new Date(S.saved) : new Date())); e.title = "같은 기기·브라우저에서만 이어 쓸 수 있어요. 쓴 글은 선생님께 전달되지 않고 이 브라우저에만 남아요."; }
}

/* ---------- 진도 전달(Firebase) ---------- */
function initFb() {
  if (typeof FB === "undefined") return;
  if (typeof Mon !== "undefined") Mon.init();
  if (typeof Assistant !== "undefined") Assistant.init({ getContext: assistantContext });
}

/* AI 도우미가 참고하는 화면: 지금 화면 가운데에 있는 문항(없으면 그 주차 머리말)과 그 문항에 학생이 쓴 글·코드, 드래그해 고른 글 */
function assistantContext() {
  const w = CONTENT.weeks[curWeek], item = Assistant.nearestMid($$("#week .item"));
  const stage = item && item.closest(".stage"), stageName = stage ? (($(".badge", stage) || {}).textContent || "").trim() : "";
  const head = `${w.n}주차 · ${w.concept} · ${w.title}`;
  let text = head;
  if (stage) { const intro = $(".intro", stage); text += `\n[단계] ${stageName}` + (intro ? "\n" + Assistant.readable(intro, 600) : ""); }
  if (item) {
    text += "\n[문항]\n" + Assistant.readable(item, 2500);
    const mine = $$("textarea", item).map(t => t.value.trim()).filter(Boolean).join("\n---\n").slice(0, 1500);     // 학생이 쓴 글·코드(내 답을 봐 달라고 물을 수 있도록)
    if (mine) text += "\n[학생이 쓴 답]\n" + mine;
  }
  return { kind: "worksheet", title: `${head}${stageName ? " · " + stageName : ""}`, text: text.slice(0, 6000), selection: Assistant.selectedText() };

/* ---------- 화면 ---------- */
function render() {
  renderTabs(); renderWeek(); updateSaveState();
  if (typeof Mon !== "undefined") Mon.refresh();
}

function renderTabs() {
  const box = $("#tabs"); box.replaceChildren();
  CONTENT.weeks.forEach((w, i) => {
    const p = weekProgress(w, S.answers), pct = p.total ? Math.round(100 * p.done / p.total) : 0;
    const t = el("button", { class: "tab", role: "tab", "aria-selected": String(i === curWeek), "data-w": i, onclick: () => { curWeek = i; lsSet(LS_KEY + "-week", i); renderTabs(); renderWeek(); scrollTo(0, 0); } },
      el("b", {}, `${w.n}주차 · ${w.concept}`), el("small", {}, w.title), el("div", { class: "bar" }, el("i", { style: `width:${pct}%` })), el("small", { class: "pg" }, `${p.done}/${p.total} 완료`));
    box.append(t);
  });
}
function refreshProgress() {
  CONTENT.weeks.forEach((w, i) => {
    const p = weekProgress(w, S.answers), t = $(`.tab[data-w="${i}"]`); if (!t) return;
    $(".bar > i", t).style.width = (p.total ? Math.round(100 * p.done / p.total) : 0) + "%"; $(".pg", t).textContent = `${p.done}/${p.total} 완료`;
  });
}

function renderWeek() {
  const w = CONTENT.weeks[curWeek], main = $("#week"); main.replaceChildren();
  main.append(el("section", { class: "hero" },
    el("div", { class: "kicker" }, `${w.n}주차 / ${CONTENT.weeks.length}주`),
    el("h2", {}, `${w.title}`),
    el("p", {}, el("span", { class: "concept" }, "핵심 개념: " + w.concept), el("span", { class: "lead" }, w.subtitle)),
    el("p", { html: w.overview }),
    el("div", { class: "pattern-links" }, el("b", {}, "함께 읽을 교재: "), w.patterns.map(p => el("a", { href: p.href, target: "_blank", rel: "noopener" }, p.name))),
    el("div", { class: "grid2" },
      el("div", { class: "card" }, el("h4", {}, "이번 주 탐구 질문"),
        el("ul", {}, [["f", "사실적", w.questions.factual], ["c", "개념적", w.questions.conceptual], ["d", "논쟁적", w.questions.debatable]]
          .flatMap(([k, lab, arr]) => arr.map(q => el("li", {}, el("span", { class: "qtag " + k }, lab), q))))),
      el("div", { class: "card" }, el("h4", {}, "이번 주 목표"), el("ul", {}, w.goals.map(g => el("li", { html: g }))),
        el("p", { class: "lead", style: "margin:8px 0 0;font-size:14px" }, ico("lightbulb"), " 일반화(결론)는 정답을 외우는 것이 아니라 4단계에서 내 말로 직접 써 보는 것입니다.")))));
  w.stages.forEach((st, si) => {
    const sec = el("section", { class: "stage", "data-s": STAGE_NO[st.key], id: `st-${w.n}-${si}` },
      el("header", {}, el("span", { class: "badge" }, `${si + 1}. ${st.title}`), el("span", { class: "min" }, `${st.en} · 약 ${st.minutes}분`)));
    if (st.intro) sec.append(el("p", { class: "intro", html: st.intro }));
    let no = 0;
    st.items.forEach(it => sec.append(renderItem(it, ANSWERABLE(it) ? ++no : 0)));
    main.append(sec);
  });
  main.append(el("div", { class: "no-print", style: "margin-top:24px;display:flex;gap:8px;flex-wrap:wrap" },
    curWeek < CONTENT.weeks.length - 1 && el("button", { class: "btn", onclick: () => { curWeek++; lsSet(LS_KEY + "-week", curWeek); renderTabs(); renderWeek(); scrollTo(0, 0); } }, "다음 주차 →")));
}

function renderItem(it, no) {
  if (it.type === "info") return el("div", { class: "item info" }, enhanceCode(el("div", { html: it.html })));
  const done = isAnswered(it, S.answers[it.id]);
  const card = el("div", { class: "item" + (done ? " done" : ""), id: it.id },
    el("div", { class: "filled-mark" }, done ? [ico("check_circle", "fill"), "작성함"] : ""),
    el("p", { class: "q" }, el("span", { class: "no" }, "Q" + no), it.optional ? el("span", { class: "opt-tag" }, "선택") : null, el("span", { html: it.q })));
  if (it.recall) card.append(recallBox(it.recall));
  if (it.compare) card.append(compareBox(it.compare));
  if (it.hint && it.type !== "text" && it.type !== "list") card.append(el("p", { class: "hint", html: it.hint }));
  card.append(renderInput(it, S.answers[it.id], v => {
    S.answers[it.id] = v; touch();
    const d = isAnswered(it, v); card.classList.toggle("done", d); $(".filled-mark", card).replaceChildren(...(d ? [ico("check_circle", "fill"), "작성함"] : []));
    refreshProgress();
    if (typeof Mon !== "undefined") Mon.note(it.id);
  }));
  return card;
}

/* 앞서 쓴 글을 다시 보여 주는 상자: 일반화를 엮어 쓰거나 처음·지금의 생각을 비교할 때 쓴다. */
function recallBox(list) {
  return el("div", { class: "recall" }, el("b", {}, "내가 앞서 쓴 글"),
    list.map(r => { const v = S.answers[r.id]; return el("div", { class: "val" }, el("span", { class: "rl" }, r.label + " "), nonEmpty(v) ? v : "(아직 쓰지 않았어요)"); }));
}
/* 이전에 한 척도 응답(예: 1주차 사전 진단)을 항목별로 보여 준다. */
function compareBox(id) {
  const v = S.answers[id], it = CONTENT.weeks.flatMap(w => w.stages.flatMap(st => st.items)).find(x => x.id === id);
  if (!it) return null;
  return el("div", { class: "recall" }, el("b", {}, "처음(1주차)에 내가 한 응답"),
    it.items.map((t, i) => el("div", { class: "val" }, el("span", { html: t }), `  →  ${v && v[i] != null ? v[i] + "/5" : "—"}`)));
}
</script>
</body>
</html>

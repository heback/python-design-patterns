<script>"use strict";
/* 파이썬 문법 강조 공용 모듈 (교재 textbook/ 과 탐구 학습지 inquiry/ 가 함께 쓴다). 외부 라이브러리·네트워크 없이 동작한다.
   토큰 클래스 이름은 Prism 과 같다(.token.keyword 등). 색은 pyrun.css 의 --tok-* 변수만 쓰므로 다크 모드가 자동으로 맞는다.
   공개 API: PyHL.html(code) → 색칠한 HTML 문자열 · PyHL.apply(root) → root 안의 code.language-python 을 색칠한다 */
const PyHL = (function () {
  const KEYWORDS = new Set(("and as assert async await break class continue def del elif else except finally for from global if import " +
    "in is lambda nonlocal not or pass raise return try while with yield match case").split(" "));
  const CONSTS = new Set(["True", "False", "None"]);
  const BUILTINS = new Set(("abs all any bool bytes callable chr dict dir divmod enumerate filter float format frozenset getattr hasattr hash " +
    "id input int isinstance issubclass iter len list map max min next object open ord pow print property range repr reversed round set setattr " +
    "slice sorted staticmethod classmethod str sum super tuple type vars zip self cls NotImplemented Ellipsis " +
    "Exception ValueError TypeError KeyError IndexError AttributeError RuntimeError NotImplementedError StopIteration ZeroDivisionError").split(" "));

  /* 한 번에 한 토큰씩 앞에서부터 읽는다. 순서가 중요하다: 긴 문자열·주석을 먼저 잡아야 그 안의 키워드가 색칠되지 않는다. */
  const RE = new RegExp([
    "(#[^\\n]*)",                                                                           // 1 주석
    "((?:[rRbBuUfF]{1,2})?(?:\"\"\"[\\s\\S]*?(?:\"\"\"|$)|'''[\\s\\S]*?(?:'''|$)))",       // 2 삼중 따옴표(독스트링)
    "((?:[rRbBuUfF]{1,2})?(?:\"(?:\\\\.|[^\"\\\\\\n])*\"?|'(?:\\\\.|[^'\\\\\\n])*'?))",     // 3 문자열
    "(^[ \\t]*@[A-Za-z_][\\w.]*)",                                                          // 4 데코레이터
    "(\\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|\\d[\\d_]*\\.?[\\d_]*(?:[eE][+-]?\\d+)?j?)\\b|\\.\\d[\\d_]*)", // 5 숫자
    "([A-Za-z_][A-Za-z_0-9]*)",                                                             // 6 식별자
    "([+\\-*/%=<>!&|^~:]+)",                                                                // 7 연산자
    "([()\\[\\]{},.;])",                                                                    // 8 구두점
  ].join("|"), "gm");

  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const span = (cls, s) => '<span class="token ' + cls + '">' + esc(s) + "</span>";

  /* f-문자열의 {표현식} 은 문자열 색에서 빼 준다. */
  function fstring(s) {
    if (!/^[rRbBuU]*[fF]/.test(s)) return span("string", s);
    return s.split(/(\{\{|\}\}|\{[^{}\n]*\})/).map((p, i) => i % 2 && p.length > 2 && p[1] !== "{" ?
      '<span class="token string-interpolation">' + esc(p) + "</span>" : span("string", p)).join("");
  }

  function html(code) {
    let out = "", last = 0, prev = "", m;           // prev: 직전 의미 있는 토큰(def/class 뒤 이름 판별용)
    RE.lastIndex = 0;
    while ((m = RE.exec(code))) {
      if (m.index > last) out += esc(code.slice(last, m.index));
      const t = m[0]; last = RE.lastIndex;
      if (m[1] != null) out += span("comment", t);
      else if (m[2] != null) out += /^[rRbBuU]*[fF]/.test(t) ? fstring(t).replace(/class="token string"/g, 'class="token triple-quoted-string string"') : span("triple-quoted-string string", t);
      else if (m[3] != null) out += fstring(t);
      else if (m[4] != null) out += esc(t.slice(0, t.indexOf("@"))) + span("decorator", t.slice(t.indexOf("@")));
      else if (m[5] != null) out += span("number", t);
      else if (m[6] != null) {
        const next = code.slice(last).match(/^[ \t]*(\()?/)[1];
        if (prev === "def") out += span("function", t);
        else if (prev === "class") out += span("class-name", t);
        else if (KEYWORDS.has(t)) out += span("keyword", t);
        else if (CONSTS.has(t)) out += span("boolean", t);
        else if (BUILTINS.has(t)) out += span("builtin", t);
        else if (next && prev !== ".") out += span("function", t);        // 일반 호출 f(...)
        else if (next) out += span("function", t);                        // 메서드 호출 obj.f(...)
        else if (/^[A-Z][A-Za-z0-9]*$/.test(t) && /[a-z]/.test(t)) out += span("class-name", t);   // CamelCase 는 클래스로 본다
        else out += esc(t);
        prev = t;
        continue;
      }
      else if (m[7] != null) out += span("operator", t);
      else out += span("punctuation", t);
      prev = "";
    }
    return out + esc(code.slice(last));
  }

  function apply(root) {
    (root || document).querySelectorAll("code.language-python:not([data-hl])").forEach(c => {
      c.innerHTML = html(c.textContent); c.dataset.hl = "1";
    });
  }

  return { html, apply };
})();
</script>
<script>"use strict";
/* 브라우저 안에서 파이썬을 실행·편집하는 공용 모듈 (교재 textbook/ 과 탐구 학습지 inquiry/ 가 함께 쓴다).
   - Pyodide(WebAssembly 파이썬)를 Web Worker 에서 돌린다. 무한 루프도 '중지'로 끊을 수 있다.
   - 처음 실행할 때 한 번만 내려받고(약 10MB) 이후에는 브라우저 캐시를 쓴다.
   공개 API: PyRun.run(code, onChunk) · PyRun.stop() · PyRun.makeRunner(getCode) · PyRun.mountEditor(opts) · PyRun.showExample(opts) */
const PyRun = (function () {
  const PYODIDE_BASE = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";

  /* Pyodide 는 스레드를 만들 수 없다. 교재 예제의 threading 은 '순차 실행'으로 흉내 낸다(경쟁 상태는 재현되지 않음). */
  const SHIM = [
    "import threading as _t",
    "def _start(self):",
    "    self.run()",
    "_t.Thread.start = _start",
    "_t.Thread.join = lambda self, timeout=None: None",
    "_t.Barrier.wait = lambda self, timeout=None: 0",
  ].join("\n");

  function workerMain() {
    let py = null;
    self.onmessage = async function (e) {
      const m = e.data;
      try {
        if (m.type === "init") {
          importScripts(m.base + "pyodide.js");
          py = await loadPyodide({ indexURL: m.base });
          await py.runPythonAsync(m.shim);
          postMessage({ type: "ready" });
        } else if (m.type === "run") {
          py.setStdout({ batched: s => postMessage({ type: "out", id: m.id, text: s + "\n" }) });
          py.setStderr({ batched: s => postMessage({ type: "out", id: m.id, text: s + "\n", err: true }) });
          const g = py.globals.get("dict")();
          g.set("__name__", "__main__");
          try {
            await py.runPythonAsync(m.code, { globals: g });
            postMessage({ type: "done", id: m.id, ok: true });
          } catch (err) {
            let msg = String((err && err.message) || err);
            const i = msg.indexOf('File "<exec>"');
            if (i >= 0) msg = "Traceback (most recent call last):\n  " + msg.slice(i);
            if (/SystemExit/.test(msg)) postMessage({ type: "done", id: m.id, ok: true });
            else postMessage({ type: "done", id: m.id, ok: false, err: msg.trimEnd() });
          } finally { g.destroy(); }
        }
      } catch (err) {
        postMessage({ type: "fatal", message: String((err && err.message) || err) });
      }
    };
  }

  let worker = null, ready = null, cur = null, seq = 0, chain = Promise.resolve();

  function boot(onStatus) {
    if (ready) return ready;
    ready = new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob(["(" + workerMain.toString() + ")()"], { type: "text/javascript" }));
      worker = new Worker(url);
      worker.onmessage = e => {
        const m = e.data;
        if (m.type === "ready") resolve();
        else if (m.type === "fatal") { reject(new Error(m.message)); if (cur) finish({ ok: false, err: m.message }); }
        else if (cur && m.id === cur.id) {
          if (m.type === "out") cur.onChunk && cur.onChunk(m.text, !!m.err);
          else if (m.type === "done") finish({ ok: m.ok, err: m.err });
        }
      };
      worker.onerror = ev => { reject(new Error("파이썬 실행기를 시작하지 못했습니다. 인터넷 연결을 확인하세요.")); };
      worker.postMessage({ type: "init", base: PYODIDE_BASE, shim: SHIM });
    });
    ready.catch(() => { reset(); });
    return ready;
  }
  function reset() { if (worker) worker.terminate(); worker = null; ready = null; }
  function finish(res) { const c = cur; cur = null; if (c) c.resolve(res); }

  /* 코드를 실행한다. 한 번에 하나씩 차례로 실행한다. 반환: Promise<{ok, err?, stopped?}> */
  function run(code, onChunk, onStatus) {
    const job = chain.then(async () => {
      try {
        if (!ready) onStatus && onStatus("loading");
        await boot();
      } catch (e) { return { ok: false, err: e.message }; }
      onStatus && onStatus("running");
      return new Promise(resolve => {
        cur = { id: ++seq, resolve, onChunk };
        worker.postMessage({ type: "run", id: cur.id, code });
      });
    });
    chain = job.catch(() => {});
    return job;
  }
  /* 실행 중인 코드를 끊는다(실행기를 새로 만든다). 다음 실행 때 캐시에서 빠르게 다시 뜬다. */
  function stop() { if (cur) { const c = cur; reset(); cur = null; c.resolve({ ok: false, stopped: true }); } }

  /* ---------- UI ---------- */
  /* 탐구 학습지는 window.PYRUN_ICONS = true 로 머티리얼 아이콘 글꼴(Material Symbols)을 쓰고, 이모지·도형 글자를 버튼과 상태에 쓰지 않는다.
     교재는 이 값이 없으므로 기존 글자("▶ 실행" 등)를 그대로 쓴다. */
  const ICONS = !!window.PYRUN_ICONS;
  const NOTE = ICONS ? "참고: " : "ℹ️ ";
  const ms = name => { const s = document.createElement("span"); s.className = "ms"; s.setAttribute("aria-hidden", "true"); s.textContent = name; return s; };
  const lab = (icon, text, glyph) => ICONS ? [ms(icon), text] : glyph + text;
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {
      const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
      try { document.execCommand("copy") ? res() : rej(); } catch (e) { rej(e); } t.remove();
    });
  }
  function flash(btn, text) { if (!btn._orig) btn._orig = Array.from(btn.childNodes).map(n => n.cloneNode(true)); btn.textContent = text; clearTimeout(btn._t); btn._t = setTimeout(() => { btn.replaceChildren(...btn._orig.map(n => n.cloneNode(true))); }, 1300); }   // 아이콘이 든 버튼도 원래 모양으로 되돌린다
  /* 높이를 내용에 맞춘다. 가로 스크롤바가 생기면 그만큼 더 키워야 세로 스크롤바가 덩달아 생기지 않는다. */
  function fit(t) { t.style.height = "auto"; const bar = t.offsetHeight - t.clientHeight; t.style.height = Math.min(t.scrollHeight + bar + 2, 560) + "px"; }

  const NOTES = [
    [/\bthreading\b/, NOTE + "브라우저에서는 스레드를 만들 수 없어, 스레드를 차례대로 실행하는 방식으로 대신합니다. (경쟁 상태는 재현되지 않습니다)"],
    [/\bsubprocess\b/, NOTE + "브라우저에서는 다른 프로그램(subprocess)을 실행할 수 없어 오류가 날 수 있습니다."],
  ];

  /* 실행 버튼·중지 버튼·상태 표시·출력 칸 한 벌. 편집기(mountEditor)와 읽기 전용 코드 블록(교재의 예제 코드)이 함께 쓴다.
     getCode() 가 돌려주는 코드를 실행하고, 결과는 outBox 에 쌓는다. outBox 는 호출한 쪽이 원하는 자리에 붙인다. */
  function makeRunner(getCode) {
    const status = h("span", { class: "pr-status" });
    const bRun = h("button", { class: "pr-btn run", type: "button", title: "실행 (Ctrl/⌘ + Enter)" }, lab("play_arrow", "실행", "▶ "));
    const bStop = h("button", { class: "pr-btn stop", type: "button", hidden: true }, lab("stop", "중지", "■ "));
    const outPre = h("pre", { class: "pr-pre" });
    const outBox = h("div", { class: "pr-out", hidden: true }, h("div", { class: "pr-outhead" }, h("span", {}, "출력"),
      h("button", { class: "pr-btn small", type: "button", onclick: () => { outBox.hidden = true; outPre.textContent = ""; } }, "지우기")), outPre);
    let busy = false;
    function setBusy(b) { busy = b; bRun.disabled = b; bStop.hidden = !b; }
    function go() {
      if (busy) return;
      const code = getCode(); outPre.textContent = ""; outBox.hidden = false;
      const note = NOTES.filter(([re]) => re.test(code)).map(n => n[1]);
      if (note.length) outPre.append(h("span", { class: "pr-note" }, note.join("\n") + "\n"));
      setBusy(true);
      const t0 = performance.now();
      PyRun.run(code, (text, isErr) => { outPre.append(isErr ? h("span", { class: "pr-err" }, text) : document.createTextNode(text)); },
        st => { status.textContent = st === "loading" ? "파이썬을 불러오는 중… (처음 한 번, 몇 초 걸려요)" : "실행 중…"; })
        .then(res => {
          setBusy(false);
          if (res.stopped) { outPre.append(h("span", { class: "pr-err" }, (ICONS ? "" : "■ ") + "사용자가 중지했습니다.\n")); status.textContent = ""; return; }
          if (!res.ok) outPre.append(h("span", { class: "pr-err" }, res.err + "\n"));
          else if (!outPre.textContent.replace(new RegExp("^" + NOTE + ".*\n"), "").trim()) outPre.append(h("span", { class: "pr-dim" }, "(출력 없음 — print() 로 결과를 찍어 보세요)\n"));
          status.textContent = (ICONS ? (res.ok ? "끝남 " : "오류 ") : (res.ok ? "✔ 끝남 " : "✖ 오류 ")) + Math.round(performance.now() - t0) + "ms";
        });
    }
    bRun.addEventListener("click", go);
    bStop.addEventListener("click", () => PyRun.stop());
    return { bRun, bStop, status, outBox, go };
  }

  /* 편집 가능한 코드 칸 + 실행 + 출력 (+ 예시 코드 버튼).
     opts: {code, starter, example, exampleTitle, onChange, minRows, label, resettable} */
  function mountEditor(opts) {
    const starter = opts.starter == null ? opts.code || "" : opts.starter;
    const ta = h("textarea", { class: "pr-ta", spellcheck: "false", autocapitalize: "off", autocomplete: "off", "aria-label": opts.label || "파이썬 코드 편집기", rows: opts.minRows || 6 });
    ta.value = opts.code == null ? starter : opts.code;
    const { bRun, bStop, status, outBox, go } = makeRunner(() => ta.value);
    const bReset = h("button", { class: "pr-btn", type: "button", title: "처음 코드로 되돌리기" }, lab("restart_alt", "처음 코드", "↺ "));
    const bCopy = h("button", { class: "pr-btn", type: "button", title: "내 코드 복사" }, "복사");
    const bEx = opts.example ? h("button", { class: "pr-btn ex", type: "button", title: "정답 예시 코드를 팝업으로 보기" }, lab("lightbulb", "예시 코드", "💡 ")) : null;
    /* 문법 강조: 글자를 투명하게 만든 textarea 뒤에 같은 글꼴의 색칠된 <pre> 를 깔고 스크롤을 맞춘다. */
    const hlCode = h("code", {}), hl = h("pre", { class: "pr-hl", "aria-hidden": "true" }, hlCode);
    const stack = h("div", { class: "pr-stack" }, hl, ta);
    /* 행 번호: 편집기 왼쪽 칸. 줄마다 점선 구분선은 CSS(.pr-hl code / .pr-gutter code 의 ::before)가 그린다. */
    const gNum = h("code", {}), gutter = h("div", { class: "pr-gutter", "aria-hidden": "true" }, h("pre", { class: "pr-gutter-pre" }, gNum));
    let nLines = 0;
    const paint = () => {
      hlCode.innerHTML = (typeof PyHL !== "undefined" ? PyHL.html(ta.value) : ta.value.replace(/&/g, "&amp;").replace(/</g, "&lt;")) + "\n";
      const n = ta.value.split("\n").length;
      if (n !== nLines) {
        nLines = n; gNum.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n");
        gutter.style.width = "calc(" + Math.max(2, String(n).length) + "ch + 24px)";
      }
      syncScroll();
    };
    /* 클래식 스크롤바(가로·세로)가 있으면 textarea 의 보이는 영역이 그만큼 작아져 스크롤 범위가 줄어든다.
       강조 층·행 번호 칸도 같은 크기로 줄여야 끝까지 스크롤했을 때 서로 어긋나지 않는다. */
    let sbW = -1, sbH = -1;
    const syncScroll = () => {
      const w = ta.offsetWidth - ta.clientWidth, hh = ta.offsetHeight - ta.clientHeight;
      if (w !== sbW || hh !== sbH) { sbW = w; sbH = hh; hl.style.right = w + "px"; hl.style.bottom = hh + "px"; gutter.firstChild.style.bottom = hh + "px"; }
      hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; gutter.firstChild.scrollTop = ta.scrollTop;
    };
    ta.addEventListener("scroll", syncScroll);
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(syncScroll).observe(ta);   // 크기 조절·높이 맞춤 뒤에도 다시 맞춘다
    const root = h("div", { class: "pr" }, h("div", { class: "pr-bar" }, bRun, bStop, opts.resettable === false ? null : bReset, bCopy, bEx, status), h("div", { class: "pr-edit" }, gutter, stack), outBox);

    ta.addEventListener("input", () => { fit(ta); paint(); opts.onChange && opts.onChange(ta.value); });
    /* [a, b) 를 text 로 바꾼다. execCommand 를 쓰면 브라우저의 실행 취소(Ctrl+Z)가 유지된다. 막혀 있으면 setRangeText 로 대신한다. */
    function replaceRange(a, b, text) {
      ta.focus(); ta.setSelectionRange(a, b);
      if (!document.execCommand("insertText", false, text)) { ta.setRangeText(text, a, b, "end"); ta.dispatchEvent(new Event("input")); }
    }
    /* 선택에 걸친 모든 줄을 들여쓰기(Tab)/내어쓰기(Shift+Tab). 선택 영역은 유지한다. */
    function shiftLines(outdent) {
      const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd, a = v.lastIndexOf("\n", s - 1) + 1;
      const last = en > s && v[en - 1] === "\n" ? en - 1 : en;       // 선택이 다음 줄 맨 앞에서 끝나면 그 줄은 제외
      let b = v.indexOf("\n", last); if (b < 0) b = v.length;
      let first = 0, total = 0;
      const out = v.slice(a, b).split("\n").map((ln, i) => {
        let d = 0;
        if (outdent) { const m = /^( {1,4}|\t)/.exec(ln); if (m) { d = -m[0].length; ln = ln.slice(m[0].length); } }
        else if (ln) { ln = "    " + ln; d = 4; }                      // 빈 줄은 건드리지 않는다
        if (i === 0) first = d; total += d; return ln;
      });
      replaceRange(a, b, out.join("\n"));
      const ns = Math.max(a, s + first); ta.setSelectionRange(ns, Math.max(ns, en + total));
    }
    let tabFree = false;                       // Esc 를 누르면 다음 Tab 은 들여쓰기 대신 포커스를 옮긴다(키보드 사용자 탈출구)
    ta.addEventListener("blur", () => { tabFree = false; });
    ta.addEventListener("keydown", e => {
      if (e.key === "Escape") { tabFree = true; return; }
      if (e.key === "Tab" && !e.ctrlKey && !e.metaKey && !e.altKey) {
        if (tabFree) { tabFree = false; return; }
        e.preventDefault();
        const s = ta.selectionStart, en = ta.selectionEnd, multi = ta.value.slice(s, en).includes("\n");
        if (e.shiftKey || multi) shiftLines(e.shiftKey);
        else replaceRange(s, en, "    ");
      } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go(); }
      else if (e.key === "Enter" && !e.shiftKey && !e.altKey) {   // 자동 들여쓰기
        const s = ta.selectionStart, line = ta.value.slice(ta.value.lastIndexOf("\n", s - 1) + 1, s);
        let ind = (/^ */.exec(line) || [""])[0]; if (/:\s*$/.test(line)) ind += "    ";
        if (ind) { e.preventDefault(); replaceRange(s, ta.selectionEnd, "\n" + ind); }
      }
    });

    bReset.addEventListener("click", () => {
      if (ta.value !== starter && ta.value.trim() && !confirm("내가 고친 코드가 처음 코드로 바뀝니다. 계속할까요?")) return;
      ta.value = starter; fit(ta); paint(); opts.onChange && opts.onChange(ta.value);
    });
    bCopy.addEventListener("click", () => copyText(ta.value).then(() => flash(bCopy, "복사됨"), () => flash(bCopy, "복사 실패")));
    if (bEx) bEx.addEventListener("click", () => showExample({ title: opts.exampleTitle, code: opts.example, opener: bEx }));
    paint(); requestAnimationFrame(() => fit(ta)); setTimeout(() => fit(ta), 80);
    return {
      el: root, textarea: ta, getValue: () => ta.value,
      setValue(v) { ta.value = v; fit(ta); paint(); }, refit: () => fit(ta),
    };
  }

  /* 정답 예시 코드 팝업. 코드는 드래그해서 복사하거나 '복사' 버튼으로 복사한다. 닫기 버튼·Esc·바깥 클릭으로 닫힌다. */
  let modal = null;
  function showExample(o) {
    closeExample();
    const prev = o.opener || document.activeElement;
    const pre = h("pre", { class: "pr-modal-code", tabindex: "0" }, h("code", { class: "language-python" }, o.code));
    if (typeof PyHL !== "undefined") PyHL.apply(pre);
    const bCopy = h("button", { class: "pr-btn", type: "button" }, lab("content_copy", "복사", "📋 "));
    const bClose = h("button", { class: "pr-btn primary", type: "button" }, "닫기");
    const title = h("h3", { id: "pr-modal-title" }, o.title || "예시 코드");
    const panel = h("div", { class: "pr-modal-panel", role: "dialog", "aria-modal": "true", "aria-labelledby": "pr-modal-title" },
      h("div", { class: "pr-modal-head" }, title, h("span", { class: "pr-grow" }), bCopy, bClose),
      h("p", { class: "pr-modal-note" }, "하나의 예시일 뿐, 이것만 정답은 아닙니다. 먼저 직접 풀어 본 뒤 비교해 보세요."), pre);
    const back = h("div", { class: "pr-modal" }, panel);
    const close = () => closeExample(prev);
    back.addEventListener("mousedown", e => { if (e.target === back) close(); });
    bClose.addEventListener("click", close);
    bCopy.addEventListener("click", () => copyText(o.code).then(() => flash(bCopy, ICONS ? "복사됨" : "✔ 복사됨"), () => flash(bCopy, "복사 실패 — 직접 선택해 복사하세요")));
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); close(); }
      else if (e.key === "Tab") {             // 팝업 안에서만 포커스 이동
        const f = [bCopy, bClose, pre]; const i = f.indexOf(document.activeElement);
        e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
      }
    };
    document.addEventListener("keydown", onKey, true);
    document.body.append(back); document.body.classList.add("pr-lock");
    modal = { back, onKey };
    bClose.focus();
  }
  function closeExample(restore) {
    if (!modal) return;
    document.removeEventListener("keydown", modal.onKey, true);
    modal.back.remove(); modal = null; document.body.classList.remove("pr-lock");
    if (restore && restore.focus) try { restore.focus(); } catch (e) {}
  }

  return { run, stop, makeRunner, mountEditor, showExample, closeExample, copyText };
})();
</script>
<script>// 이 파일을 firebase-config.js 로 복사해 Firebase 콘솔의 웹 앱 설정값을 채운 뒤 `python3 inquiry/build.py` 를 실행하세요.
// (웹 앱 config는 비밀이 아니지만, 접근 통제는 firestore.rules·functions가 맡습니다.)
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyB4Uq99CbKzTgHaqTR_AHXPXjKoXlN1AYc",
  authDomain: "dshs-inquiry-feedback-21382.firebaseapp.com",
  projectId: "dshs-inquiry-feedback-21382",
  appId: "1:187448839872:web:437fdf433edc402eb0e725"
};
window.FIREBASE_REGION = "asia-northeast3";   // Functions 지역(firebase/functions/config.js의 REGION과 같아야 함)
window.TEACHER_DOMAIN = "ts.hs.kr";           // 교사 학교 계정 도메인(firestore.rules·functions/config.js와 같게)

"use strict";
/* Firebase 어댑터(학생·교사 공용). 빌드에서 firebase-config.js가 있을 때만 포함된다.
   SDK는 고정 버전 CDN에서 필요할 때 불러온다. 모든 규칙 검사는 서버(firestore.rules, functions)가 한다. */
const FB = (() => {
  const VER = "11.10.0", BASE = `https://www.gstatic.com/firebasejs/${VER}/`;
  const REGION = window.FIREBASE_REGION || "asia-northeast3", DOMAIN = window.TEACHER_DOMAIN || "ts.hs.kr";
  const EMU = /[?&]emulator\b/.test(location.search);
  let M = null;
  /* 학생 식별은 로그인 계정으로만 한다: 진도 문서 ID = uid, 이름 = 계정 이름(없으면 이메일 앞부분), 이메일 = 계정 이메일 */
  const who = u => ({ name: ((u.displayName || "").trim() || (u.email || "").split("@")[0]), email: (u.email || "").toLowerCase() });

  async function load() {
    if (M) return M;
    const [app, auth, fs, fn] = await Promise.all(["app", "auth", "firestore", "functions"].map(n => import(`${BASE}firebase-${n}.js`)));
    const a = app.initializeApp(window.FIREBASE_CONFIG), au = auth.getAuth(a), db = fs.getFirestore(a), fx = fn.getFunctions(a, REGION);
    if (EMU) { auth.connectAuthEmulator(au, "http://localhost:9099", { disableWarnings: true }); fs.connectFirestoreEmulator(db, "localhost", 8080); fn.connectFunctionsEmulator(fx, "localhost", 5001); }
    return (M = { app, auth, fs, fn, au, db, fx });
  }

  /* ---------- 공통 ---------- */
  /* 지금 로그인한 학교 Google 계정(없으면 null). 학생·교사 모두 같은 로그인을 쓴다. */
  async function currentUser() {
    const m = await load(); await m.au.authStateReady();
    const u = m.au.currentUser; return u && !u.isAnonymous ? u : null;
  }
  async function schoolUser() {
    const u = await currentUser();
    if (!u) { const e = new Error("학교 Google 계정으로 로그인해야 합니다."); e.code = "auth/login-required"; throw e; }
    return u;
  }
  const call = async (name, data) => { const m = await load(); return (await m.fn.httpsCallable(m.fx, name)(data)).data; };
  const fbErr = e => (e && (e.message || e.code)) || String(e);

  /* ---------- 학생 AI 도우미 ---------- */
  const watchAssistant = cb => watchDoc("config", "assistant", cb);
  const askAssistant = p => call("askAssistant", p);

  /* ---------- 진도 수집(학생) ---------- */
  /* 문서 하나를 실시간으로 구독한다. 문서가 없으면 null, 읽기에 실패하면 undefined 를 콜백에 준다. */
  async function watchDoc(col, id, cb) {
    const m = await load();
    return m.fs.onSnapshot(m.fs.doc(m.db, col, id), s => cb(s.exists() ? s.data() : null), () => cb(undefined));
  }
  const watchMonitor = cb => watchDoc("config", "monitor", cb);
  /* 진도 한 번 전송. p = {weeks?, chapters?, where?, focus?, activeMs, lastActiveAt(ms)}. 응답 본문은 보내지 않는다.
     학습지는 weeks 를, 교재 페이지는 chapters 를 보낸다. merge 로 쓰므로 서로의 필드를 덮어쓰지 않는다. */
  async function reportProgress(p) {
    const user = await schoolUser(), m = await load(), { doc, setDoc, serverTimestamp, Timestamp } = m.fs;
    const d = { student: who(user),
      uid: user.uid, activeMs: Math.round(p.activeMs), lastActiveAt: Timestamp.fromMillis(p.lastActiveAt), updatedAt: serverTimestamp() };
    if (p.weeks) d.weeks = p.weeks;
    if (p.chapters) d.chapters = p.chapters;
    if (p.where) d.where = String(p.where).slice(0, 80);
    if (p.focus) Object.assign(d, { view: p.focus.view, viewAt: Timestamp.fromMillis(p.focus.viewAt), leaves: p.focus.leaves, awayMs: p.focus.awayMs });   // 화면을 보고 있는지(student-auth.js FocusTrack)
    await setDoc(doc(m.db, "progress", user.uid), d, { merge: true });
  }

  /* 내 진도 문서 한 번 읽기(없으면 null). 기기를 바꾸거나 기록이 지워져도 값이 줄지 않게, 보내기 전에 서버의 값과 비교해 큰 쪽을 쓴다. */
  async function readMyProgress() {
    const u = await schoolUser(), m = await load(), s = await m.fs.getDoc(m.fs.doc(m.db, "progress", u.uid));
    return s.exists() ? s.data() : null;
  }

  /* ---------- 진도 제어(교사) ---------- */
  async function watchProgress(cb) {
    const m = await load();
    return m.fs.onSnapshot(m.fs.collection(m.db, "progress"), snap => cb(snap.docs.map(d => Object.assign({ id: d.id }, d.data()))), e => cb(null, e));
  }
  /* 켜기/끄기는 서버 함수가 한다: 스위치와 변경 이력(monitorEvents)을 서버 시각으로 함께 쓰고, 클라이언트는 직접 쓰지 못한다. */
  const saveMonitor = on => call("setMonitor", { on: !!on });
  const watchMonitorEvents = cb => live("monitorEvents", cb, m => m.fs.query(m.fs.collection(m.db, "monitorEvents"), m.fs.orderBy("at", "desc"), m.fs.limit(30)));
  async function saveAssistant(on) {
    const m = await load();
    await m.fs.setDoc(m.fs.doc(m.db, "config", "assistant"), { on: !!on, updatedBy: m.au.currentUser.email, updatedAt: m.fs.Timestamp.now() });
  }
  /* AI 도우미 기록·집계(교사). 함수가 쓰고 교사만 읽는다. */
  const live = (col, cb, q) => load().then(m => m.fs.onSnapshot(q ? q(m) : m.fs.collection(m.db, col), snap => cb(snap.docs.map(d => Object.assign({ id: d.id }, d.data()))), e => cb(null, e)));
  const watchChatUsage = cb => live("chatUsage", cb);
  const watchChatLogs = (cb, n) => live("chatLogs", cb, m => m.fs.query(m.fs.collection(m.db, "chatLogs"), m.fs.orderBy("at", "desc"), m.fs.limit(n || 200)));
  async function watchStats(cb) { const m = await load(); return m.fs.onSnapshot(m.fs.doc(m.db, "stats", "assistant"), s => cb(s.exists() ? s.data() : null, null), e => cb(null, e)); }
  async function clearChatLogs() {
    const m = await load(), { collection, getDocs, deleteDoc } = m.fs, snap = await getDocs(collection(m.db, "chatLogs"));
    await Promise.all(snap.docs.map(d => deleteDoc(d.ref))); return snap.size;
  }
  async function clearProgress() {
    const m = await load(), { collection, getDocs, deleteDoc } = m.fs;
    const snap = await getDocs(collection(m.db, "progress"));
    await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
    return snap.size;
  }

  /* ---------- 교사 ---------- */
  async function signIn() {
    const m = await load(), p = new m.auth.GoogleAuthProvider();
    p.setCustomParameters({ hd: DOMAIN, prompt: "select_account" });
    return m.auth.signInWithPopup(m.au, p);
  }
  async function onAuth(cb) { const m = await load(); return m.auth.onAuthStateChanged(m.au, cb); }
  async function signOut() { const m = await load(); return m.auth.signOut(m.au); }
  const teacherContent = () => call("getTeacherContent", {});

  return { who, domain: DOMAIN, fbErr, currentUser,
           watchMonitor, reportProgress, readMyProgress, watchAssistant, askAssistant, saveAssistant, watchChatUsage, watchChatLogs, watchStats, clearChatLogs,
           watchProgress, saveMonitor, watchMonitorEvents, clearProgress,
           signIn, onAuth, signOut, teacherContent };
})();
</script>
<script>const CONTENT = {"weeks": [{"n": 1, "concept": "변화", "title": "변화는 어디서 오는가 — 변경 축 찾기", "subtitle": "전략 · 템플릿 메서드", "overview": "같은 코드가 몇 달 사이에 왜 무서워질까요? 이번 주에는 ‘고쳐야 할 이유’가 서로 다른 것들이 한 곳에 뒤엉킨 모습을 직접 관찰하고, <b>변화를 한 곳에 가두는 두 가지 방법<\/b>(합성으로 갈아 끼우기 · 상속으로 빈칸 채우기)을 비교합니다.", "goals": ["‘변경 축’(서로 다른 이유로 바뀌는 부분)을 코드에서 찾아 말할 수 있다.", "전략과 템플릿 메서드가 변화를 가두는 방식의 같은 점·다른 점을 설명할 수 있다.", "패턴을 넣을 때와 넣지 않을 때를 근거를 들어 판단할 수 있다."], "questions": {"factual": ["배달비 코드에서 if 분기는 몇 개이며, 각 분기는 누가(어느 팀이) 바꾸자고 하는가?", "전략 패턴의 구성 요소(Context, Strategy, 구체 전략)는 각각 무엇을 맡는가?"], "conceptual": ["‘변화’는 코드의 어떤 성질로 드러나는가?", "변화를 격리하는 비용은 무엇이며, 언제 그 비용이 아깝지 않은가?"], "debatable": ["“분기가 세 개만 넘으면 전략 패턴을 써야 한다”는 주장에 동의하는가?"]}, "patterns": [{"ch": 0, "name": "서론", "href": "../textbook/00-intro.html"}, {"ch": 10, "name": "10장 전략", "href": "../textbook/10-strategy.html"}, {"ch": 14, "name": "14장 템플릿 메서드", "href": "../textbook/14-template-method.html"}], "product": "배달비·채점기 변경 축 분석표, 전략 리팩터링 코드, 첫 번째 일반화 문장", "stages": [{"key": "engage", "title": "몰입", "en": "Tuning in", "minutes": 10, "intro": "코드를 ‘고치는 사람’이 되어 봅니다. 아직 정답을 찾지 말고, 느낌과 예상을 솔직하게 적어 보세요.", "items": [{"id": "w1-e0", "type": "info", "html": "<p><b>상황.<\/b> 음식 배달 플랫폼 ‘한끼배달’의 민재는 처음에 배달비를 ‘기본 3,000원 + km당 500원’으로 정했습니다. 사업이 커지면서 우천·심야 할증, 구독 회원 무료, 가게 프로모션이 차례로 붙었고, 민재는 그때마다 <code>if<\/code>를 하나씩 더했습니다.<\/p><pre><code>def delivery_fee(order, rainy=False, night=False, subscriber=False, promo=None):\n    fee = 3000 + 500 * order.km          # 기본 3,000원 + km당 500원\n    if rainy:\n        fee += 1000                      # 우천 할증\n    if night:\n        fee += 1500                      # 심야 할증\n    if subscriber:\n        fee = 0                          # 한끼패스 회원은 무료\n    if promo == &quot;STORE_HALF&quot;:\n        fee = fee // 2                   # 가게 프로모션: 절반 부담\n    return fee<\/code><\/pre><p class='lead'>읽을 교재: 10장 1~2절 ‘상황’과 ‘순진한 코드’<\/p>"}, {"id": "w1-e1", "type": "text", "rows": 3, "q": "이 함수에서 <b>가장 불안한 줄<\/b>은 어디인가요? 왜 그렇게 느꼈나요?", "hint": "예) ‘~줄의 ~가 ~와 순서가 바뀌면 ~할 것 같다’"}, {"id": "w1-e2", "type": "text", "rows": 5, "q": "다음 분기에 <b>들어올 법한 새 요구사항<\/b>을 3~4가지 상상하고, 각각 <b>누가(어느 팀이) 왜<\/b> 바꾸자고 할지 적은 뒤, <b>‘같은 이유로 바뀌는 것끼리’ 묶어<\/b> 보세요.", "hint": "예) 학생 할인 — 마케팅팀, 신규 고객을 늘리려고 …  /  묶음: ‘요금 정책’ 계열 …"}, {"id": "w1-e3", "type": "scales", "q": "지금의 나는? (사전 진단 — 점수는 평가에 쓰이지 않으며, 5주차 마지막에 같은 문항으로 다시 응답해 비교합니다)", "items": ["코드에서 ‘서로 다른 이유로 바뀌는 부분(변경 축)’을 찾을 수 있다", "닮은 패턴(전략/상태, 데코레이터/프록시)을 의도로 구별할 수 있다", "패턴을 쓰지 않는 선택도 설계라고 설명할 수 있다", "‘분리하면 복잡도는 사라지지 않고 옮겨 간다’를 예로 설명할 수 있다", "패턴을 넣으면 코드가 항상 좋아진다고 생각한다"], "labels": ["전혀 아니다", "매우 그렇다"]}]}, {"key": "find", "title": "조사", "en": "Finding out", "minutes": 30, "intro": "직접 예측하고, 실행해서 확인하고, 두 가지 해법의 구조를 읽습니다.", "items": [{"id": "w1-f0", "type": "info", "html": "<p>다음 코드를 <b>실행하기 전에<\/b> 출력을 예측하세요. (배달 4km: 기본 5,000원)<\/p><pre><code>class Order:\n    def __init__(self, km): self.km = km\n\ndef fee(order, rainy=False, subscriber=False, promo=None):\n    f = 3000 + 500 * order.km\n    if rainy: f += 1000\n    if subscriber: f = 0\n    if promo == &quot;HALF&quot;: f //= 2\n    return f\n\nprint(fee(Order(4), rainy=True, subscriber=True))\nprint(fee(Order(4), rainy=True, promo=&quot;HALF&quot;))\nprint(fee(Order(4), subscriber=True, promo=&quot;HALF&quot;))<\/code><\/pre>"}, {"id": "w1-f1", "type": "text", "rows": 6, "q": "<b>예측 → 실행 → 설명<\/b>: (1) 세 줄의 출력을 예측하고 직접 실행한 결과와 비교하세요. 틀렸다면 어디서 틀렸나요? (2) <code>if subscriber<\/code> 줄을 <b>맨 앞<\/b>으로 옮기고 <code>rainy=True, subscriber=True<\/code>로 호출하면 결과가 어떻게 바뀌나요? 이것은 코드의 어떤 문제를 보여 주나요?", "hint": "예) (1) 예측: ?, ?, ? / 실제: ?, ?, ? (2) …"}, {"id": "w1-f3", "type": "info", "html": "<p><b>해법 A. 전략(Strategy).<\/b> 규칙 자체를 ‘갈아 끼울 수 있는 값’으로 만듭니다. (교재 10장 3~4절)<\/p><pre><code>from typing import Callable\n\nFeeRule = Callable[[&quot;Order&quot;], int]            # 전략: Order를 받아 배달비(int)를 돌려주는 함수\n\ndef distance_rule(o): return 3000 + 500 * o.km\ndef subscriber_rule(o): return 0\ndef rainy_rule(o):    return distance_rule(o) + 1000\n\nRULES: dict[str, FeeRule] = {                 # 이름표 → 전략. 새 규칙은 여기에 한 줄 추가\n    &quot;base&quot;: distance_rule, &quot;sub&quot;: subscriber_rule, &quot;rain&quot;: rainy_rule,\n}\n\nclass Order:\n    def __init__(self, km, rule: FeeRule = distance_rule):\n        self.km, self.rule = km, rule         # 규칙을 &#x27;들고&#x27; 있을 뿐, 어떤 규칙인지는 모른다\n    def fee(self):\n        return self.rule(self)                # 위임\n\nprint(Order(4).fee(), Order(4, RULES[&quot;sub&quot;]).fee(), Order(4, RULES[&quot;rain&quot;]).fee())<\/code><\/pre>"}, {"id": "w1-f4", "type": "table", "corner": "새 요구가 생기면", "cols": ["if 분기 방식(순진한 코드)", "전략 방식"], "rows": ["‘학생 할인’ 규칙 추가", "구독 규칙만 바뀜", "규칙별 테스트 작성", "실행 중 규칙 교체"], "q": "네 가지 변화가 일어날 때, 각 방식에서 <b>무엇을 열어서 고쳐야 하는지<\/b> 적어 보세요."}, {"id": "w1-f5", "type": "choice", "q": "전략 패턴에서 ‘<b>어떤 규칙을 쓸지 고르는 코드<\/b>’는 어디에 있어야 할까요?", "options": ["Order 클래스 안의 if 문", "Order를 만드는 쪽(호출 측)이나 설정 — 전략 바깥", "각 규칙 함수 안", "패턴을 쓰면 선택 코드는 사라진다"]}, {"id": "w1-f6", "type": "info", "html": "<p><b>해법 B. 템플릿 메서드(Template Method).<\/b> 이번에는 ‘절차는 고정, 일부 단계만 바뀌는’ 상황입니다. 코딩 교육 플랫폼 ‘코드랩’의 채점기입니다. (교재 14장)<\/p><pre><code>class Grader:\n    def grade(self, source, cases):               # ← 템플릿 메서드: 골격은 여기 하나\n        path = self.save(source)                  # (1) 소스 저장\n        results = []\n        for case in cases:\n            out = self.run(path, case.input)      # (2) 실행  ← 언어마다 다름\n            results.append(out.strip() == case.expected)   # (3) 출력 비교\n        self.record(results)                      # (4) 결과 기록\n        return results\n\n    def save(self, source): ...                   # 고정 단계\n    def record(self, results): ...                # 고정 단계\n    def run(self, path, stdin): raise NotImplementedError   # 비워 둔 단계(추상)\n\nclass PythonGrader(Grader):\n    def run(self, path, stdin): ...               # python path 실행\nclass CGrader(Grader):\n    def compile_cmd(self): return [&quot;gcc&quot;, &quot;-O2&quot;]  # ← 훅: 기본값이 있고 필요할 때만 덮어씀\n    def run(self, path, stdin): ...               # 컴파일 후 실행<\/code><\/pre>"}, {"id": "w1-f7", "type": "sort", "q": "채점기의 단계들을 <b>골격에 고정할 것<\/b>과 <b>하위 클래스가 채울 것<\/b>으로 나눠 보세요.", "cards": ["소스 저장", "코드 실행(언어마다 다름)", "출력과 기대값 비교", "결과 기록", "C 컴파일 명령", "시간 제한 정책"], "buckets": ["골격에 고정", "하위 클래스가 채움(추상 단계·훅)"]}]}, {"key": "sort", "title": "조직", "en": "Sorting out", "minutes": 15, "intro": "관찰한 것을 정리합니다. 개념 사이의 <b>관계<\/b>를 직접 연결하고, 두 패턴을 비교표로 나란히 놓습니다.", "items": [{"id": "w1-s1", "type": "triples", "min": 5, "relations": ["를 격리한다", "를 가능하게 한다", "의 비용이다", "와 대립한다", "를 구현한다", "에 의존한다", "의 한 종류다"], "q": "<b>개념 지도<\/b>: 변화, 변경 축, 인터페이스, 전략, 템플릿 메서드, 상속, 합성, 간접층 — 이 개념들 사이의 관계를 5개 정도 ‘A —관계→ B’로 만들어 보세요. 가장 중요한 연결 하나에는 <b>왜 그 관계인지 한 줄<\/b>을 덧붙이세요.", "hint": "‘관계’ 칸에는 동사구를 쓰세요. 칸에 마우스를 올리면 추천 표현이 나옵니다."}, {"id": "w1-s2", "type": "table", "corner": "비교 관점", "cols": ["전략", "템플릿 메서드"], "rows": ["변화를 담는 방법", "바꿀 수 있는 시점", "변하는 축이 두 개 이상일 때", "결합의 세기"], "q": "두 패턴을 4가지 관점에서 비교해 채워 보세요."}]}, {"key": "general", "title": "일반화", "en": "Making conclusions", "minutes": 20, "intro": "이제 이번 주의 핵심을 <b>자기 말로<\/b> 한 문장으로 써 봅니다. 그 문장이 틀리는 경우를 찾아 <b>고쳐 쓰고<\/b>, 논쟁적 질문에 근거를 갖고 입장을 정합니다.", "items": [{"id": "w1-g1", "type": "text", "rows": 3, "q": "<b>나의 일반화(초안)<\/b>: ‘변화’에 대해 오늘 알게 된 것을 “~할수록 ~하지만, ~” 형태의 한 문장으로 써 보세요.", "hint": "얻는 것과 치르는 것을 함께 담아 보세요."}, {"id": "w1-g2", "type": "text", "rows": 3, "q": "<b>반례 찾기<\/b>: 위 일반화가 <b>들어맞지 않거나 오히려 해가 되는<\/b> 상황을 하나, 숫자나 조건을 넣어 구체적으로 만들어 보세요.", "hint": "짝과 일반화를 바꿔 읽고, 짝의 문장에 반례를 붙여 주어도 좋아요."}, {"id": "w1-gr", "type": "text", "rows": 3, "q": "<b>일반화 수정본<\/b>: 반례를 반영해 위 일반화를 다시 써 보세요. 조건을 덧붙이거나 적용 범위를 좁히고, 초안과 <b>무엇이 달라졌는지<\/b>도 한 줄로 적어 보세요.", "hint": "수정본: … / 달라진 점: …"}, {"id": "w1-gd", "type": "text", "rows": 7, "q": "<b>논쟁적 질문<\/b>: “분기가 세 개만 넘으면 전략 패턴을 써야 한다.” (1) 나의 입장(동의 / 부분 동의 / 반대) (2) 근거 두 가지 (3) 반대편의 <b>가장 강한 반론<\/b>과 그에 대한 나의 응답 (4) 어떤 조건이 달라지면 입장을 바꿀 것인가", "hint": "정답이 없는 질문입니다. ‘어디까지 동의하는가’를 조건으로 말해 보세요. 이번 주 코드(배달비·보고서 내보내기)의 사실을 근거로 쓰면 좋아요."}]}, {"key": "transfer", "title": "전이", "en": "Going further", "minutes": 20, "intro": "배운 것을 <b>새로운 코드<\/b>에 적용합니다. 판단 문항에서는 ‘쓰지 않는 선택’도 정답일 수 있습니다.", "items": [{"id": "w1-t0", "type": "info", "html": "<p><b>리팩터링 과제.<\/b> 보고서 내보내기 함수입니다. 새 형식(<code>json<\/code>)이 계속 늘어날 예정입니다.<\/p><pre><code>def export(rows, fmt):\n    if fmt == &quot;csv&quot;:\n        return &quot;\\n&quot;.join(&quot;,&quot;.join(map(str, r)) for r in rows)\n    elif fmt == &quot;tsv&quot;:\n        return &quot;\\n&quot;.join(&quot;\\t&quot;.join(map(str, r)) for r in rows)\n    elif fmt == &quot;md&quot;:\n        return &quot;\\n&quot;.join(&quot;| &quot; + &quot; | &quot;.join(map(str, r)) + &quot; |&quot; for r in rows)\n    raise ValueError(fmt)\n\nprint(export([[1, 2], [3, 4]], &quot;csv&quot;))<\/code><\/pre>"}, {"id": "w1-t1", "type": "code", "starter": "def export(rows, fmt):\n    if fmt == \"csv\":\n        return \"\\n\".join(\",\".join(map(str, r)) for r in rows)\n    elif fmt == \"tsv\":\n        return \"\\n\".join(\"\\t\".join(map(str, r)) for r in rows)\n    elif fmt == \"md\":\n        return \"\\n\".join(\"| \" + \" | \".join(map(str, r)) + \" |\" for r in rows)\n    raise ValueError(fmt)\n\nprint(export([[1, 2], [3, 4]], \"csv\"))", "hint": "export()를 다시 열지 않고도 새 형식을 추가할 수 있게 고치고, 마지막에 json 형식을 ‘추가’해 보세요. (실행해서 확인한 코드를 붙여 넣으세요)", "q": "위 코드를 <b>전략(등록부)<\/b> 방식으로 리팩터링하세요.", "answer": "FORMATTERS = {}                                   # 이름표 → 변환 함수 (전략 등록부)\n\ndef formatter(name):\n    def reg(fn):\n        FORMATTERS[name] = fn\n        return fn\n    return reg\n\n@formatter(\"csv\")\ndef to_csv(rows): return \"\\n\".join(\",\".join(map(str, r)) for r in rows)\n@formatter(\"tsv\")\ndef to_tsv(rows): return \"\\n\".join(\"\\t\".join(map(str, r)) for r in rows)\n@formatter(\"md\")\ndef to_md(rows):  return \"\\n\".join(\"| \" + \" | \".join(map(str, r)) + \" |\" for r in rows)\n\ndef export(rows, fmt):                            # 이제 export()는 새 형식이 생겨도 열 필요가 없다\n    try:\n        return FORMATTERS[fmt](rows)\n    except KeyError:\n        raise ValueError(fmt) from None\n\n@formatter(\"json\")                                # ← 새 형식은 '추가'만으로 끝\ndef to_json(rows):\n    import json\n    return json.dumps(rows)"}, {"id": "w1-t2", "type": "choice", "q": "상품 목록을 <b>이름순 / 가격순<\/b> 두 가지로 정렬하려 합니다. 가장 적절한 설계는?", "options": ["SortStrategy 추상 클래스와 NameSort, PriceSort 클래스를 만든다", "<code>sorted(items, key=...)<\/code>처럼 정렬 키 함수를 인자로 받는다", "if sort_by == 'name': … elif … 를 그대로 둔다", "템플릿 메서드로 정렬 골격을 만든다"]}, {"id": "w1-t3", "type": "text", "rows": 5, "q": "<b>나의 삶에서 찾기<\/b>: 내가 만들었거나 쓰고 있는 코드(또는 학교·동아리의 규칙·절차 — 급식 신청, 동아리 회비 등)에서 <b>변경 축을 두 개<\/b> 찾고, 각각 어떻게 분리할 수 있을지 적어 보세요."}]}, {"key": "reflect", "title": "성찰", "en": "Reflecting", "minutes": 5, "intro": "생각이 어떻게 달라졌는지 돌아보고, 다음 탐구를 스스로 정합니다.", "items": [{"id": "w1-r2", "type": "text", "rows": 3, "q": "수업 전과 비교해 <b>가장 달라진 내 생각<\/b>은 무엇인가요? 또는 아직 <b>헷갈리는 점<\/b>은?"}, {"id": "w1-r3", "type": "text", "rows": 2, "q": "다음 주에 탐구해 보고 싶은 <b>나만의 개념적 질문<\/b> 하나를 적어 보세요.", "hint": "한 사례를 넘어 적용되는 질문이면 좋아요. 예) ‘~는 어떤 조건에서 ~할까?’"}]}]}, {"n": 2, "concept": "책임", "title": "누가 만드는가 — 생성의 책임 나누기", "subtitle": "팩토리 메서드 · 추상 팩토리 · 빌더 · 싱글턴", "overview": "<code>CsvReader()<\/code> 한 줄에는 생각보다 많은 ‘앎’이 들어 있습니다. 이번 주에는 <b>객체를 만드는 책임<\/b>이 누구에게 있어야 하는지, 그 책임을 옮기면 무엇이 편해지고 무엇이 어딘가에 남는지를 네 가지 생성 패턴으로 탐구합니다.", "goals": ["‘new를 쓴다’는 것이 코드에 어떤 앎(결합)을 만드는지 설명할 수 있다.", "네 가지 생성 문제(한 객체 선택·제품군·단계적 조립·하나만)를 상황에서 가려낼 수 있다.", "싱글턴의 ‘하나뿐임’과 ‘전역 접근’을 분리해 생각하고 대안(주입)을 설계할 수 있다."], "questions": {"factual": ["팩토리 메서드·추상 팩토리·빌더·싱글턴은 각각 어떤 상황에서 등장했는가?", "감사 로그 기록기가 ‘하나여야’ 하는 이유는 무엇인가?"], "conceptual": ["생성을 분리하면 ‘앎’은 어디서 어디로 이동하는가?", "‘하나여야 한다’와 ‘어디서든 얻는다’는 같은 요구인가?"], "debatable": ["“싱글턴은 안티패턴이므로 쓰면 안 된다”는 주장에 어디까지 동의하는가?"]}, "patterns": [{"ch": 1, "name": "1장 팩토리 메서드", "href": "../textbook/01-factory-method.html"}, {"ch": 2, "name": "2장 추상 팩토리", "href": "../textbook/02-abstract-factory.html"}, {"ch": 3, "name": "3장 빌더", "href": "../textbook/03-builder.html"}, {"ch": 4, "name": "4장 싱글턴", "href": "../textbook/04-singleton.html"}], "product": "생성 패턴 비교표, 상황 분류 카드, 싱글턴 → 주입 리팩터링 코드, 두 번째 일반화 문장", "stages": [{"key": "engage", "title": "몰입", "en": "Tuning in", "minutes": 10, "intro": "한 줄짜리 생성 코드가 품고 있는 것을 들여다봅니다.", "items": [{"id": "w2-e0", "type": "info", "html": "<p><b>상황.<\/b> 연구실 자동화를 맡은 박사과정생 서윤은 장비가 하나뿐이라 아래처럼 Reader를 직접 만들었습니다. 그런데 곧 적외선(IR) 분광기가 들어옵니다.<\/p><pre><code>class AcquisitionJob:                         # 분석화학 연구실: 장비 측정 → 정규화 → 저장\n    def run(self, device_id):\n        reader = CsvSpectrumReader()          # ← 구체 클래스 이름을 직접 안다\n        raw = reader.read(device_id)\n        data = normalize(raw)\n        archive.save(data)<\/code><\/pre><p class='lead'>읽을 교재: 1장 1~2절<\/p>"}, {"id": "w2-e1", "type": "text", "recall": [{"id": "w1-r3", "label": "지난주 내가 만든 질문:"}], "rows": 3, "q": "<b>[지난주 내 질문]<\/b> 위 상자의 내 질문에 이번 주 활동으로 답할 수 있을지 한 줄로 예상해 보고, 이어서 아래에 답하세요. <code>CsvSpectrumReader()<\/code>라고 쓰는 코드는 이 클래스에 대해 <b>무엇을 ‘알고’ 있는<\/b> 걸까요? 최대한 많이 적어 보세요.", "hint": "예) 클래스 이름, …"}, {"id": "w2-e2", "type": "text", "rows": 4, "hint": "예) 장비 종류가 늘어날 때 … / 공통 원인: …", "q": "<code>new<\/code> 한 줄이 <b>고통이 되는 순간<\/b>을 2~3가지 상상해 보고, 그 고통들의 <b>공통된 원인<\/b>이 무엇인지 한 문장으로 써 보세요."}]}, {"key": "find", "title": "조사", "en": "Finding out", "minutes": 30, "intro": "코드를 읽고, 예측하고, 네 가지 생성 패턴을 조사해 비교합니다.", "items": [{"id": "w2-f0", "type": "info", "html": "<p><b>팩토리 메서드의 구조.<\/b> 새 장비가 들어와도 <code>AcquisitionJob<\/code>의 흐름은 건드리지 않습니다.<\/p><pre><code>class AcquisitionJob:                         # Creator: 흐름(템플릿)은 여기 한 곳\n    def run(self, device_id):\n        reader = self.make_reader()           # ← &#x27;무엇을&#x27; 만들지는 하위 클래스에 위임\n        archive.save(normalize(reader.read(device_id)))\n    def make_reader(self):                    # 팩토리 메서드\n        raise NotImplementedError\n\nclass UvVisJob(AcquisitionJob):\n    def make_reader(self): return CsvSpectrumReader()\nclass IrJob(AcquisitionJob):\n    def make_reader(self): return JcampReader()     # 새 장비: 클래스 하나 추가<\/code><\/pre>"}, {"id": "w2-f1", "type": "text", "rows": 3, "q": "IR 분광기(JCAMP 형식)를 추가한다면 <b>기존 클래스 중 열어야 하는 것<\/b>과 <b>새로 만들어야 하는 것<\/b>은 무엇인가요? 그리고 ‘어느 장비면 어느 Job’을 고르는 코드는 <b>어디에<\/b> 있게 되나요?"}, {"id": "w2-f2", "type": "info", "html": "<p><b>싱글턴의 함정.<\/b> 다음 코드를 실행하기 전에 출력을 예측하세요. (교재 4장 개념 문제 1과 같은 계열)<\/p><pre><code>class Counter:\n    _inst = None\n    def __new__(cls):\n        if cls._inst is None:\n            cls._inst = super().__new__(cls)\n            cls._inst.n = 0\n        return cls._inst\n    def __init__(self):\n        self.n = 0\n\na = Counter(); a.n = 5\nb = Counter()\nprint(a is b, b.n)<\/code><\/pre>"}, {"id": "w2-f3", "type": "text", "rows": 3, "q": "출력을 예측하고, 실행 결과와 비교하세요. 결과의 원인은 무엇인가요?"}, {"id": "w2-g2", "type": "choice", "q": "<b>싱글턴<\/b>의 본질은 무엇일까요?", "options": ["어디서든 접근할 수 있는 전역 객체", "인스턴스가 하나뿐임을 보장하는 것", "‘하나여야 한다’와 ‘어디서든 얻는다’는 별개의 결정이며, 분리할 수 있다", "‘하나’와 ‘전역 접근’은 함께여야 의미가 있다"]}, {"id": "w2-f4", "type": "table", "corner": "패턴", "cols": ["누가 무엇을 결정·수행하나 (생성의 책임이 옮겨 간 곳)", "그 대가로 치르는 비용"], "rows": ["팩토리 메서드", "추상 팩토리", "빌더", "싱글턴"], "q": "교재 1~4장의 ‘상황’과 ‘트레이드오프’ 절을 읽고, 네 패턴이 <b>생성의 책임을 누구에게 옮기는지<\/b>와 <b>그 대가<\/b>를 채워 보세요.", "hint": "각 칸은 한두 문장. 교재 문장을 그대로 옮기지 말고 내 말로 줄여 보세요."}]}, {"key": "sort", "title": "조직", "en": "Sorting out", "minutes": 15, "intro": "여러 상황 속에서 생성 문제의 <b>유형<\/b>을 가려내고, 개념을 연결합니다.", "items": [{"id": "w2-s1", "type": "sort", "q": "각 상황은 어떤 생성 패턴이 어울리는 문제인가요?", "cards": ["수집 흐름은 같은데 장비마다 다른 Reader를 써야 한다", "AWS면 S3+SQS+SecretsManager, GCP면 GCS+Pub/Sub+SecretManager가 짝이어야 한다", "SELECT 쿼리: 필터·그룹·정렬·제한이 선택적이고 읽히는 순서가 중요하다", "감사 로그 기록기는 ‘마지막 해시’를 쥐고 있어 두 개면 체인이 깨진다", "CLI 위젯 세트(버튼·입력창·라벨)를 라이트/다크 테마별로 일관되게 만든다", "HTTP 요청을 여러 함수가 조건에 따라 조금씩 쌓아 가고, 마지막 build() 때 ‘GET에 본문 금지’ 같은 교차 규칙을 검사해야 한다", "로그 수집기가 파일 또는 syslog 중 하나를 만들어 쓴다(수집 흐름은 동일)"], "buckets": ["팩토리 메서드", "추상 팩토리", "빌더", "싱글턴"]}, {"id": "w2-s2", "type": "triples", "min": 5, "relations": ["를 분리한다", "를 알고 있다", "에 의존한다", "를 옮긴다", "를 보장한다", "와 구별된다", "의 비용이다"], "q": "<b>개념 지도<\/b>: 책임, 결합, 구체 클래스, 추상, 생성, 주입, 전역 접근, 하나뿐임 — 관계를 5개 정도 연결해 보세요. 가장 중요한 연결 하나에는 <b>왜 그 관계인지 한 줄<\/b>을 덧붙이세요."}]}, {"key": "general", "title": "일반화", "en": "Making conclusions", "minutes": 20, "intro": "‘책임’에 대한 나의 일반화를 쓰고, 반례로 시험해 <b>고쳐 쓰며<\/b>, 논쟁적 질문에 근거를 갖고 입장을 정합니다.", "items": [{"id": "w2-g1", "type": "text", "rows": 3, "q": "<b>나의 일반화(초안)<\/b>: ‘생성의 책임’에 대해 이번 주에 알게 된 것을 “~할수록 ~하지만, ~” 형태의 한 문장으로 써 보세요.", "hint": "‘앎’이 어디로 이동하는지 포함해 보세요."}, {"id": "w2-g3", "type": "text", "rows": 3, "q": "<b>반례 찾기<\/b>: 생성 책임을 분리했는데 <b>오히려 나빠진<\/b> 경우를, 숫자나 조건을 넣어 구체적으로 하나 만들어 보세요.", "hint": "짝과 일반화를 바꿔 읽고, 짝의 문장에 반례를 붙여 주어도 좋아요."}, {"id": "w2-gr", "type": "text", "rows": 3, "q": "<b>일반화 수정본<\/b>: 반례를 반영해 위 일반화를 다시 써 보세요. 조건을 덧붙이거나 적용 범위를 좁히고, 초안과 <b>무엇이 달라졌는지<\/b>도 한 줄로 적어 보세요.", "hint": "수정본: … / 달라진 점: …"}, {"id": "w2-gd", "type": "text", "rows": 7, "q": "<b>논쟁적 질문<\/b>: “싱글턴은 안티패턴이므로 쓰면 안 된다.” (1) 나의 입장(동의 / 부분 동의 / 반대) (2) 근거 두 가지 (3) 반대편의 <b>가장 강한 반론<\/b>과 그에 대한 나의 응답 (4) 어떤 조건이 달라지면 입장을 바꿀 것인가", "hint": "‘하나뿐임’과 ‘전역 접근’을 나누어 생각하면 ‘어디까지’ 동의하는지 말하기 쉬워요."}]}, {"key": "transfer", "title": "전이", "en": "Going further", "minutes": 20, "intro": "배운 것을 새 코드와 새 상황에 적용합니다.", "items": [{"id": "w2-t0", "type": "info", "html": "<p><b>리팩터링 과제.<\/b> 어디서든 <code>Config.instance()<\/code>를 부르는 코드입니다. 테스트에서 <code>debug=True<\/code> 상황을 검증하기 어렵습니다.<\/p><pre><code>class Config:\n    _instance = None\n    @classmethod\n    def instance(cls):\n        if cls._instance is None:\n            cls._instance = cls()\n        return cls._instance\n    def __init__(self):\n        self.debug = False\n\ndef process(x):\n    if Config.instance().debug:          # ← 어디서든 전역으로 접근\n        print(&quot;debug&quot;, x)\n    return x * 2<\/code><\/pre>"}, {"id": "w2-t1", "type": "code", "starter": "class Config:\n    _instance = None\n    @classmethod\n    def instance(cls):\n        if cls._instance is None:\n            cls._instance = cls()\n        return cls._instance\n    def __init__(self):\n        self.debug = False\n\ndef process(x):\n    if Config.instance().debug:          # ← 어디서든 전역으로 접근\n        print(\"debug\", x)\n    return x * 2", "q": "전역 접근을 <b>제거<\/b>하고, ‘하나’는 유지하면서 테스트에서 설정을 바꿔 끼울 수 있게 <b>주입<\/b> 방식으로 고쳐 보세요.", "hint": "‘하나’는 누가 지키게 되나요? (코드 주석으로 설명해도 좋아요)", "answer": "from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Config:                             # 설정은 그냥 값 객체. '하나'는 만드는 쪽이 지킨다\n    debug: bool = False\n\ndef process(x, config: Config):           # 필요한 것을 인자로 받는다(주입)\n    if config.debug:\n        print(\"debug\", x)\n    return x * 2\n\n# 앱 진입점에서 딱 한 번 만든다  → '하나'\nconfig = Config(debug=False)\nprocess(3, config)\n\n# 테스트에서는 마음대로 바꿔 끼운다  → 전역 상태 오염 없음\nprocess(3, Config(debug=True))"}, {"id": "w2-t2", "type": "choice", "q": "필수 인자 2개와 선택 옵션 6개를 가진 <b>HTTP 요청 설정 객체<\/b>를 만들려 합니다. 가장 적절한 접근은?", "options": ["Builder 클래스를 만들어 메서드 체이닝으로 조립한다", "dataclass에 기본값을 두고 키워드 인자로 만든다", "싱글턴으로 하나만 만든다", "추상 팩토리로 만든다"]}, {"id": "w2-t3", "type": "text", "rows": 5, "q": "<b>나의 삶에서 찾기<\/b>: 내가 아는 프로그램(게임·앱·학교 시스템)에서 <b>‘하나만 있어야’ 하는 것<\/b>과 <b>‘짝이 맞아야’ 하는 것<\/b>을 하나씩 찾고, 어떤 방식으로 생성 책임을 두면 좋을지 적어 보세요."}]}, {"key": "reflect", "title": "성찰", "en": "Reflecting", "minutes": 5, "intro": "이번 주의 배움을 돌아봅니다.", "items": [{"id": "w2-r2", "type": "text", "rows": 4, "recall": [{"id": "w1-gr", "label": "1주차 일반화(수정본):"}], "q": "<b>주 간 연결<\/b>: 위 상자의 지난주 일반화와 이번 주 일반화를 나란히 놓고, <b>공통된 구조<\/b>나 <b>서로 부딪치는 점<\/b>을 하나 찾아 쓰세요. 그리고 아직 헷갈리는 점도 적어 주세요."}, {"id": "w2-r3", "type": "text", "rows": 2, "q": "다음 주에 탐구해 보고 싶은 <b>나만의 개념적 질문<\/b> 하나를 적어 보세요.", "hint": "한 사례를 넘어 적용되는 질문이면 좋아요. 예) ‘~는 어떤 조건에서 ~할까?’"}]}]}, {"n": 3, "concept": "경계", "title": "경계에 서는 객체 — 감싸기의 의도", "subtitle": "어댑터 · 데코레이터 · 컴포지트 · 퍼사드 · 프록시", "overview": "구조 패턴은 서로 닮았습니다. 클래스 다이어그램만 보면 대부분 ‘감싸고 위임’입니다. 이번 주에는 <b>같은 모양인데 왜 다른 이름일까?<\/b>라는 질문으로, 경계에 서는 객체가 <b>무엇을 바꾸고 무엇을 지키는지<\/b>를 탐구합니다.", "goals": ["겉모양이 같은 구조 패턴을 ‘의도(왜 감싸는가)’로 구별할 수 있다.", "어댑터·퍼사드·프록시·데코레이터·컴포지트가 인터페이스를 다루는 방식(변환·단순화·통제·덧붙임·재귀 합성)을 설명할 수 있다.", "경계 객체를 직접 설계·구현하고, 과잉 적용을 가려낼 수 있다."], "questions": {"factual": ["어댑터·퍼사드·프록시·데코레이터·컴포지트는 각각 인터페이스를 어떻게 다루는가?", "데코레이터의 순서가 바뀌면 결과가 어떻게 달라지는가?"], "conceptual": ["같은 ‘감싸기’ 구조가 서로 다른 패턴이 되게 하는 것은 무엇인가?", "‘경계’에 놓는 객체는 무엇을 보호하고 무엇을 노출하는가?"], "debatable": ["“퍼사드는 서브시스템으로 가는 다른 길을 막아야 한다”는 주장에 동의하는가?"]}, "patterns": [{"ch": 5, "name": "5장 어댑터", "href": "../textbook/05-adapter.html"}, {"ch": 6, "name": "6장 데코레이터", "href": "../textbook/06-decorator.html"}, {"ch": 7, "name": "7장 컴포지트", "href": "../textbook/07-composite.html"}, {"ch": 8, "name": "8장 퍼사드", "href": "../textbook/08-facade.html"}, {"ch": 9, "name": "9장 프록시", "href": "../textbook/09-proxy.html"}], "product": "구조 패턴 5종 의도 비교표, 상황 분류, 어댑터 구현, 세 번째 일반화 문장", "stages": [{"key": "engage", "title": "몰입", "en": "Tuning in", "minutes": 10, "intro": "경계에 선 코드를 관찰하고 ‘구조만으로 구별할 수 있을까?’ 하는 질문을 만나 봅니다.", "items": [{"id": "w3-e0", "type": "info", "html": "<p><b>상황.<\/b> 솔숲상회는 PG사 A의 SDK를 주문·환불·정산 코드 세 곳에서 직접 불렀습니다. 어느 날 PG사 B로 일부 교체하라는 지시가 내려옵니다. B의 SDK는 <code>charge()<\/code>가 아니라 <code>pay(order_id, …)<\/code>를 제공하고 오류도 다릅니다. (교재 5장 1절)<\/p>"}, {"id": "w3-e1", "type": "text", "recall": [{"id": "w2-r3", "label": "지난주 내가 만든 질문:"}], "rows": 3, "q": "<b>[지난주 내 질문]<\/b> 위 상자의 내 질문에 이번 주 활동으로 답할 수 있을지 한 줄로 예상해 보고, 이어서 아래에 답하세요. 다른 사람이 만든 라이브러리(또는 SDK)의 사용법이 내 코드와 맞지 않았던 경험이 있나요? 그때 <b>어떻게 해결했고, 어떤 점이 불편<\/b>했나요?", "hint": "경험이 없다면 ‘만약 그런 상황이라면 어떻게 하겠는지’를 적어도 좋아요."}, {"id": "w3-e2", "type": "info", "html": "<p>아래 클래스는 어떤 패턴일까요? 모양은 하나뿐입니다.<\/p><pre><code>class Wrapper:\n    def __init__(self, inner):\n        self.inner = inner                # 다른 객체를 감싸고\n    def send(self, x):\n        return self.inner.send(x)         # 호출을 그대로(또는 약간 바꿔) 위임한다<\/code><\/pre>"}, {"id": "w3-e3", "type": "choice", "q": "위 코드(모양)만 보고 이것이 <b>어댑터인지, 데코레이터인지, 프록시인지<\/b> 알 수 있을까요?", "options": ["알 수 있다. 구조에 이름이 있다", "알 수 없다. 코드의 ‘의도’를 알아야 한다", "셋은 사실 같은 패턴이다"]}]}, {"key": "find", "title": "조사", "en": "Finding out", "minutes": 30, "intro": "예측으로 데코레이터를 이해하고, 다섯 구조 패턴을 조사해 비교합니다.", "items": [{"id": "w3-f0", "type": "info", "html": "<p><b>데코레이터의 순서.<\/b> 실행하기 전에 두 줄의 출력을 예측하세요. (교재 6장 개념 문제 1)<\/p><pre><code>def encrypt(m):  return &quot;E(&quot; + m + &quot;)&quot;\ndef compress(m): return &quot;C(&quot; + m + &quot;)&quot;\n\nclass Chan:\n    def send(self, m): print(&quot;send&quot;, m)\n\nclass Enc:                                # 암호화 데코레이터\n    def __init__(self, inner): self.inner = inner\n    def send(self, m): self.inner.send(encrypt(m))\n\nclass Comp:                               # 압축 데코레이터\n    def __init__(self, inner): self.inner = inner\n    def send(self, m): self.inner.send(compress(m))\n\nEnc(Comp(Chan())).send(&quot;hi&quot;)              # (가)\nComp(Enc(Chan())).send(&quot;hi&quot;)              # (나)<\/code><\/pre>"}, {"id": "w3-f1", "type": "text", "rows": 4, "q": "(가)와 (나)의 출력을 예측하고 실행으로 확인하세요. 그리고 <b>실제 통신<\/b>에서는 ‘압축 후 암호화’와 ‘암호화 후 압축’ 중 어느 쪽이 맞는지, 위 코드 중 어느 것이 그 순서인지 적어 보세요.", "hint": "힌트: 암호화된 데이터는 무작위처럼 보여 잘 압축되지 않습니다."}, {"id": "w3-f2", "type": "table", "corner": "패턴", "cols": ["의도 (왜 감싸는가)", "인터페이스는? (바꿈 / 유지 / 새로 정의)"], "rows": ["어댑터", "퍼사드", "프록시", "데코레이터", "컴포지트"], "q": "교재 5~9장을 읽고 구조 패턴 5종을 <b>의도<\/b>와 <b>인터페이스를 다루는 방식<\/b>으로 비교해 채워 보세요."}]}, {"key": "sort", "title": "조직", "en": "Sorting out", "minutes": 15, "intro": "여러 상황에서 어떤 경계 객체가 필요한지 판단하고, 개념을 연결합니다.", "items": [{"id": "w3-s1", "type": "sort", "q": "각 상황에는 어떤 패턴이 어울릴까요?", "cards": ["PG사 B의 SDK는 pay()를 제공하는데, 우리 코드는 charge()를 기대한다", "체크인 키오스크가 예약·여권·좌석·수하물·탑승권 서비스 5개를 늘 같은 순서로 불러야 한다", "수백 MB 위성 영상은 실제로 볼 때까지 내려받지 않고 싶다", "센서 전송 채널에 로깅·재시도·압축을 필요한 조합으로 덧붙이고 싶다", "부품 → 조립품 → 완제품의 원가를 모두 같은 get_cost()로 구하고 싶다", "관리자만 호출할 수 있게 메서드 호출 앞에서 권한을 검사한다", "조직도(팀·부서·본부)의 인건비를 합산한다", "SDK 응답의 필드명과 단위를 우리 도메인 모델로 번역한다"], "buckets": ["어댑터", "퍼사드", "프록시", "데코레이터", "컴포지트"]}, {"id": "w3-g2", "type": "multi", "q": "다음 중 <b>옳은 진술<\/b>을 모두 고르세요.", "options": ["데코레이터는 감싼 객체와 같은 인터페이스를 유지한다", "어댑터는 보통 인터페이스를 유지한 채 기능을 덧붙인다", "프록시는 실제 객체의 생성·접근을 통제하기도 한다", "퍼사드는 서브시스템으로 가는 다른 길을 항상 물리적으로 막는다", "컴포지트는 단품과 묶음을 같은 인터페이스로 다루게 한다"]}, {"id": "w3-s2", "type": "text", "rows": 4, "q": "<b>같은 모양, 다른 의도<\/b>: ‘데코레이터’와 ‘프록시’는 둘 다 같은 인터페이스로 감쌉니다. 둘을 가르는 질문 두 가지를 직접 만들어 보세요."}, {"id": "w3-s3", "type": "triples", "min": 5, "relations": ["를 감싼다", "를 바꾼다", "를 유지한다", "를 단순화한다", "를 통제한다", "를 덧붙인다", "와 구별된다", "에 의존한다"], "q": "<b>개념 지도<\/b>: 경계, 인터페이스, 위임, 감싸기, 의도, 구조, 통제, 단순화 — 관계를 5개 정도 연결해 보세요. 가장 중요한 연결 하나에는 <b>왜 그 관계인지 한 줄<\/b>을 덧붙이세요."}]}, {"key": "general", "title": "일반화", "en": "Making conclusions", "minutes": 20, "intro": "‘경계’에 대한 일반화를 쓰고, 반례로 시험해 <b>고쳐 쓰며<\/b>, 논쟁적 질문에 근거를 갖고 입장을 정합니다.", "items": [{"id": "w3-g1", "type": "text", "rows": 3, "q": "<b>나의 일반화(초안)<\/b>: ‘경계에 놓는 객체’에 대해 이번 주 알게 된 것을 “~일수록(~하면) ~하지만, ~” 형태의 한 문장으로 써 보세요.", "hint": "구조와 의도의 관계, 그리고 감싸는 비용(간접층)을 담아 보세요."}, {"id": "w3-g3", "type": "text", "rows": 3, "q": "<b>반례 찾기<\/b>: 경계 객체를 두었는데 <b>오히려 불필요했던<\/b> 경우를, 숫자나 조건을 넣어 구체적으로 하나 만들어 보세요.", "hint": "짝과 일반화를 바꿔 읽고, 짝의 문장에 반례를 붙여 주어도 좋아요."}, {"id": "w3-gr", "type": "text", "rows": 3, "q": "<b>일반화 수정본<\/b>: 반례를 반영해 위 일반화를 다시 써 보세요. 조건을 덧붙이거나 적용 범위를 좁히고, 초안과 <b>무엇이 달라졌는지<\/b>도 한 줄로 적어 보세요.", "hint": "수정본: … / 달라진 점: …"}, {"id": "w3-gd", "type": "text", "rows": 7, "q": "<b>논쟁적 질문<\/b>: “퍼사드는 서브시스템으로 가는 다른 길을 막아야 한다.” (1) 나의 입장(동의 / 부분 동의 / 반대) (2) 근거 두 가지 (3) 반대편의 <b>가장 강한 반론<\/b>과 그에 대한 나의 응답 (4) 어떤 조건이 달라지면 입장을 바꿀 것인가", "hint": "‘단순화’와 ‘통제(막기)’가 같은 목적인지부터 생각해 보세요."}]}, {"key": "transfer", "title": "전이", "en": "Going further", "minutes": 20, "intro": "새로운 상황에서 경계 객체를 직접 구현하고 판단합니다.", "items": [{"id": "w3-t0", "type": "info", "html": "<p><b>구현 과제.<\/b> 온도 센서 두 종류를 같은 코드로 다루려고 합니다. <code>FahrenheitSensor<\/code>는 남의 SDK라 고칠 수 없습니다. (교재 5장 연습 2)<\/p><pre><code>class CelsiusSensor:                      # 우리 쪽 센서: 섭씨\n    def read_c(self): return 21.5\n\nclass FahrenheitSensor:                   # 남의 SDK(고칠 수 없음): 화씨\n    def get_temperature(self): return 70.7\n\ndef report(sensor):                       # 클라이언트는 sensor.celsius() 만 안다\n    print(f&quot;{sensor.celsius():.1f}°C&quot;)<\/code><\/pre>"}, {"id": "w3-t1", "type": "code", "starter": "class CelsiusSensor:                      # 우리 쪽 센서: 섭씨\n    def read_c(self): return 21.5\n\nclass FahrenheitSensor:                   # 남의 SDK(고칠 수 없음): 화씨\n    def get_temperature(self): return 70.7\n\ndef report(sensor):                       # 클라이언트는 sensor.celsius() 만 안다\n    print(f\"{sensor.celsius():.1f}°C\")", "q": "<code>report()<\/code>가 <b>두 센서 모두<\/b>에 동작하도록 어댑터를 작성하세요. (실행해서 <code>21.5°C<\/code>가 두 번 나오는지 확인)", "answer": "class CelsiusSensor:\n    def read_c(self): return 21.5\n\nclass FahrenheitSensor:\n    def get_temperature(self): return 70.7\n\nclass CelsiusAdapter:                     # 우리 쪽 센서도 같은 Target(celsius())로 맞춘다\n    def __init__(self, s): self._s = s\n    def celsius(self): return self._s.read_c()\n\nclass FahrenheitAdapter:                  # 남의 SDK를 우리 언어로 번역\n    def __init__(self, s): self._s = s\n    def celsius(self): return (self._s.get_temperature() - 32) * 5 / 9\n\ndef report(sensor):\n    print(f\"{sensor.celsius():.1f}°C\")\n\nreport(CelsiusAdapter(CelsiusSensor()))\nreport(FahrenheitAdapter(FahrenheitSensor()))   # 둘 다 21.5°C"}, {"id": "w3-t2", "type": "choice", "q": "동료가 ‘모든 서비스 호출을 한 곳에 모으자’며 <b>메서드 30개짜리 퍼사드<\/b>를 제안합니다. 가장 적절한 반응은?", "options": ["좋다. 퍼사드는 많이 모을수록 단순하다", "서브시스템 API를 그대로 복제한 것이라 단순화가 아니다. 반복되는 ‘흐름’ 몇 개만 퍼사드로 만든다", "퍼사드 대신 프록시로 바꾼다", "서브시스템을 모두 싱글턴으로 만든다"]}, {"id": "w3-t3", "type": "text", "rows": 6, "q": "<b>나의 삶에서 찾기<\/b>: 내가 쓰는 외부 서비스(급식 API, 소셜 로그인, 결제, 지도 등)를 하나 골라, <b>내 코드와 서비스 사이에 둘 경계 객체<\/b>를 설계해 보세요. 클래스 이름, 메서드 3개 이내, 그리고 이것이 어댑터·퍼사드·프록시 중 무엇인지 이유와 함께 적어 보세요."}]}, {"key": "reflect", "title": "성찰", "en": "Reflecting", "minutes": 5, "intro": "이번 주의 배움을 돌아봅니다.", "items": [{"id": "w3-r2", "type": "text", "rows": 4, "recall": [{"id": "w2-gr", "label": "2주차 일반화(수정본):"}], "q": "<b>주 간 연결<\/b>: 위 상자의 지난주 일반화와 이번 주 일반화를 나란히 놓고, <b>공통된 구조<\/b>나 <b>서로 부딪치는 점<\/b>을 하나 찾아 쓰세요. 그리고 아직 헷갈리는 패턴 쌍도 적어 주세요."}, {"id": "w3-r3", "type": "text", "rows": 2, "q": "다음 주에 탐구해 보고 싶은 <b>나만의 개념적 질문<\/b> 하나를 적어 보세요.", "hint": "한 사례를 넘어 적용되는 질문이면 좋아요. 예) ‘~는 어떤 조건에서 ~할까?’"}]}]}, {"n": 4, "concept": "상호작용", "title": "누가 누구를 아는가 — 객체 사이의 호출 관계", "subtitle": "옵저버 · 커맨드 · 상태 · 반복자", "overview": "객체는 혼자 일하지 않습니다. 이번 주에는 <b>호출 관계를 직접 호출에서 간접(통지·요청 객체·상태 객체·순회)으로<\/b> 바꿨을 때 ‘누가 누구를 아는가’, 그리고 ‘언제 일어나는가’가 어떻게 달라지는지 탐구합니다.", "goals": ["직접 호출·분기가 만드는 의존의 방향을 그림으로 설명할 수 있다.", "옵저버·커맨드·상태·반복자가 끊어 주는 의존과 새로 생기는 약속(통지 순서, 이력, 전이, 순회 프로토콜)을 설명할 수 있다.", "파이썬 기능이 흡수한 패턴(콜러블, for/제너레이터)을 알아볼 수 있다(제너레이터 구현은 도전 과제)."], "questions": {"factual": ["옵저버에서 통지 도중 구독을 해제하면 어떤 일이 생기는가?", "커맨드 객체는 어떤 정보를 가지고 있어야 되돌릴 수 있는가?"], "conceptual": ["‘직접 호출’에서 ‘간접 호출’로 바꾸면 의존의 방향은 어떻게 달라지는가?", "상태 패턴에서 ‘전이를 누가 정하는가’는 왜 중요한가?"], "debatable": ["“상태 패턴을 쓰면 if 분기가 없어지므로 항상 더 좋은 코드가 된다”는 주장에 동의하는가?"]}, "patterns": [{"ch": 11, "name": "11장 옵저버", "href": "../textbook/11-observer.html"}, {"ch": 12, "name": "12장 커맨드", "href": "../textbook/12-command.html"}, {"ch": 13, "name": "13장 상태", "href": "../textbook/13-state.html"}, {"ch": 15, "name": "15장 반복자", "href": "../textbook/15-iterator.html"}], "product": "의존 방향 표, 상황 분류, 옵저버·반복자 구현, 상태 전이표, 네 번째 일반화 문장", "stages": [{"key": "engage", "title": "몰입", "en": "Tuning in", "minutes": 10, "intro": "직접 호출과 분기가 쌓인 코드를 보고, ‘누가 누구를 알고 있는지’ 눈으로 확인합니다.", "items": [{"id": "w4-e0", "type": "info", "html": "<p><b>상황 1.<\/b> 증권 앱의 시세 수신기는 새 가격이 들어오면 필요한 곳을 직접 호출합니다. (교재 11장 1~2절)<\/p><pre><code>class PriceFeed:\n    def push_price(self, price):\n        chart.redraw(price)               # 처음엔 이 한 줄이면 충분했다\n        alarm.check(price)                # 가격 알림이 생겼다\n        portfolio.recalc(price)           # 평가손익 계산이 생겼다\n        logger.record(price)              # 감사 로그가 생겼다 …  (다음 분기: 모바일 푸시?)<\/code><\/pre><p><b>상황 2.<\/b> 공유 킥보드의 상태 관리입니다. (교재 13장 1~2절)<\/p><pre><code>class Scooter:\n    def press_button(self):\n        if self.status == &quot;available&quot;:\n            self.unlock(); self.status = &quot;riding&quot;\n        elif self.status == &quot;riding&quot;:\n            self.lock(); self.status = &quot;available&quot;\n        elif self.status == &quot;paused&quot;:          # 일시정지가 생겼다\n            ...\n        elif self.status == &quot;broken&quot;:          # 고장이 생겼다\n            ...                                # 모든 메서드(unlock, end_ride, report…)에 같은 분기가 반복된다<\/code><\/pre>"}, {"id": "w4-e1", "type": "text", "recall": [{"id": "w3-r3", "label": "지난주 내가 만든 질문:"}], "rows": 4, "q": "<b>[지난주 내 질문]<\/b> 위 상자의 내 질문에 이번 주 활동으로 답할 수 있을지 한 줄로 예상해 보고, 이어서 아래에 답하세요. <code>PriceFeed<\/code>가 <b>알고 있는 것<\/b>을 모두 적어 보세요. 새로 ‘모바일 푸시’가 필요하면 어디를 고쳐야 하나요? 이 변경은 시세 수신과 관련 있을까요?"}, {"id": "w4-e2", "type": "text", "rows": 3, "q": "<code>Scooter.press_button()<\/code>의 <code>if/elif<\/code>는 상태가 하나 늘 때 <b>몇 군데<\/b>를 고쳐야 할까요? 그 이유는?"}]}, {"key": "find", "title": "조사", "en": "Finding out", "minutes": 30, "intro": "예측과 실행으로 각 패턴의 ‘약속’을 확인하고, 네 패턴을 비교합니다.", "items": [{"id": "w4-f0", "type": "info", "html": "<p><b>옵저버의 함정.<\/b> 실행하기 전에 출력을 예측하세요. (교재 11장 개념 문제 1)<\/p><pre><code>class Feed:\n    def __init__(self): self.subs = []\n    def subscribe(self, f): self.subs.append(f)\n    def push(self, p):\n        for f in self.subs:\n            f(p)\n\nfeed = Feed()\nlog = []\n\ndef once(p):\n    log.append((&quot;once&quot;, p))\n    feed.subs.remove(once)               # 한 번 받고 스스로 구독 해제\n\nfeed.subscribe(once)\nfeed.subscribe(lambda p: log.append((&quot;b&quot;, p)))\nfeed.push(1)\nfeed.push(2)\nprint(log)<\/code><\/pre>"}, {"id": "w4-f1", "type": "text", "rows": 4, "q": "<code>print(log)<\/code>의 출력을 예측하고 실행으로 확인하세요. 예상과 달랐다면 <b>왜<\/b> 그런 일이 일어났는지, 어떻게 고치면 되는지 적어 보세요."}, {"id": "w4-f2", "type": "info", "html": "<p><b>커맨드의 이력.<\/b> 실행하기 전에 출력을 예측하세요. (교재 12장)<\/p><pre><code>class Shape: x = 0\n\nclass Move:                                # 커맨드: &#x27;요청&#x27;을 값으로 만든 것\n    def __init__(self, s, dx): self.s, self.dx = s, dx\n    def do(self):   self.s.x += self.dx\n    def undo(self): self.s.x -= self.dx\n\ns = Shape(); hist = []\nfor dx in (3, 4, 5):\n    c = Move(s, dx); c.do(); hist.append(c)\nhist.pop().undo()                          # 가장 최근 것을 되돌린다\nprint(s.x, len(hist))<\/code><\/pre>"}, {"id": "w4-f3", "type": "text", "rows": 3, "q": "<code>print(s.x, len(hist))<\/code>의 출력을 예측하고, <code>Move<\/code>가 <b>되돌리기를 하려면 꼭 가지고 있어야 하는 정보<\/b>가 무엇인지 적어 보세요."}, {"id": "w4-f4", "type": "choice", "q": "<b>상태<\/b> 패턴과 <b>전략<\/b> 패턴은 클래스 구조가 거의 같습니다. 둘을 가르는 가장 큰 차이는?", "options": ["상태는 클래스가 더 많다", "전략은 바깥(클라이언트)이 교체를 결정하고, 상태는 상태 객체(또는 그 결과)가 다음 상태를 정한다", "전략은 상속을, 상태는 합성을 쓴다", "차이가 없고 이름만 다르다"]}, {"id": "w4-f5", "type": "table", "corner": "패턴", "cols": ["직접 호출·분기가 만드는 고통", "새로 생기는 객체·약속 (치르는 비용)"], "rows": ["옵저버", "커맨드", "상태", "반복자"], "q": "교재 11~13장·15장의 ‘트레이드오프’ 절을 읽고, 네 패턴이 <b>풀어 주는 고통<\/b>과 <b>그 대가로 생기는 약속<\/b>을 채워 보세요."}, {"id": "w4-g2", "type": "multi", "q": "다음 중 <b>옳은 진술<\/b>을 모두 고르세요.", "options": ["옵저버에서 발행자는 관찰자의 구체 클래스를 알 필요가 없다", "옵저버는 통지 순서와 예외 격리를 항상 자동으로 안전하게 처리해 준다", "커맨드는 요청을 값(객체)으로 만들어 저장·지연·취소할 수 있게 한다", "상태 패턴은 if 분기를 없애므로 항상 코드가 짧아진다", "파이썬의 for 루프는 반복자 패턴을 언어가 흡수한 것이다"]}]}, {"key": "sort", "title": "조직", "en": "Sorting out", "minutes": 15, "intro": "상황을 네 패턴으로 분류하고, 의존의 방향을 정리하고, 개념을 연결합니다.", "items": [{"id": "w4-s1", "type": "sort", "q": "각 상황은 어떤 패턴이 어울릴까요?", "cards": ["시세가 바뀌면 차트·알림·로그가 각자 반응해야 하고 반응하는 쪽은 앞으로 늘어난다", "도형 이동·색 변경을 실행 취소하고 매크로로 묶고 싶다", "킥보드가 잠김·주행·일시정지·고장일 때 같은 버튼이 다르게 동작한다", "플레이리스트가 리스트인지 서버 페이지인지 몰라도 차례로 재생하고 싶다", "주문 취소 요청을 출고 전에 대기열에 넣어 두었다가 나중에 실행한다", "회원가입 뒤 환영 메일·쿠폰·통계 집계가 각각 독립적으로 늘어난다", "결재 문서가 임시저장·상신·승인·반려일 때 가능한 행동이 다르다"], "buckets": ["옵저버", "커맨드", "상태", "반복자"]}, {"id": "w4-s2", "type": "table", "corner": "패턴", "cols": ["알게 되는 쪽 (→ 의존이 생김)", "모르게 되는 쪽 (의존이 끊김)"], "rows": ["옵저버", "커맨드", "상태", "반복자"], "q": "<b>의존의 방향<\/b>: 각 패턴을 적용한 뒤 ‘누가 누구를 알게 되고, 누가 누구를 모르게 되는지’ 채워 보세요."}, {"id": "w4-s3", "type": "triples", "min": 5, "relations": ["를 간접화한다", "를 알고 있다", "에 의존한다", "를 약속한다", "를 가능하게 한다", "와 구별된다", "의 비용이다"], "q": "<b>개념 지도<\/b>: 상호작용, 의존 방향, 통지, 요청, 상태, 순회, 결합도, 약속 — 관계를 5개 정도 연결해 보세요. 가장 중요한 연결 하나에는 <b>왜 그 관계인지 한 줄<\/b>을 덧붙이세요."}]}, {"key": "general", "title": "일반화", "en": "Making conclusions", "minutes": 20, "intro": "‘상호작용’에 대한 일반화를 쓰고, 반례로 시험해 <b>고쳐 쓰며<\/b>, 논쟁적 질문에 근거를 갖고 입장을 정합니다.", "items": [{"id": "w4-g1", "type": "text", "rows": 3, "q": "<b>나의 일반화(초안)<\/b>: ‘객체 사이의 호출 관계’에 대해 이번 주 알게 된 것을 “~할수록 ~하지만, ~” 형태의 한 문장으로 써 보세요.", "hint": "의존 방향의 변화와, 새로 생기는 약속(비용)을 함께 담아 보세요."}, {"id": "w4-g3", "type": "text", "rows": 3, "q": "<b>반례 찾기<\/b>: 간접 관계로 바꿨는데 <b>오히려 불필요했던<\/b> 경우를, 숫자나 조건을 넣어 구체적으로 하나 만들어 보세요.", "hint": "짝과 일반화를 바꿔 읽고, 짝의 문장에 반례를 붙여 주어도 좋아요."}, {"id": "w4-gr", "type": "text", "rows": 3, "q": "<b>일반화 수정본<\/b>: 반례를 반영해 위 일반화를 다시 써 보세요. 조건을 덧붙이거나 적용 범위를 좁히고, 초안과 <b>무엇이 달라졌는지<\/b>도 한 줄로 적어 보세요.", "hint": "수정본: … / 달라진 점: …"}, {"id": "w4-gd", "type": "text", "rows": 7, "q": "<b>논쟁적 질문<\/b>: “상태 패턴을 쓰면 if 분기가 없어지므로 항상 더 좋은 코드가 된다.” (1) 나의 입장(동의 / 부분 동의 / 반대) (2) 근거 두 가지 (3) 반대편의 <b>가장 강한 반론<\/b>과 그에 대한 나의 응답 (4) 어떤 조건이 달라지면 입장을 바꿀 것인가", "hint": "분기가 ‘없어지는’ 것인지 ‘옮겨 가는’ 것인지부터 따져 보세요. 킥보드(상태 4개)와 회의실(상태 3개) 사례를 근거로 쓸 수 있어요."}]}, {"key": "transfer", "title": "전이", "en": "Going further", "minutes": 20, "intro": "새로운 코드와 상황에 적용합니다.", "items": [{"id": "w4-t0", "type": "info", "html": "<p><b>구현 과제 1 (옵저버).<\/b> 회원가입 후속 작업이 <code>sign_up()<\/code>에 박혀 있습니다. (교재 11장 연습 2)<\/p><pre><code>def send_welcome_mail(user): print(&quot;메일 →&quot;, user[&quot;email&quot;])\ndef issue_coupon(user):      print(&quot;쿠폰 →&quot;, user[&quot;email&quot;])\ndef track_signup(user):      print(&quot;통계 +1&quot;)\n\ndef sign_up(email):\n    user = {&quot;email&quot;: email}\n    send_welcome_mail(user)               # 회원가입이 후속 작업을 전부 알고 있다\n    issue_coupon(user)\n    track_signup(user)\n    return user<\/code><\/pre>"}, {"id": "w4-t1", "type": "code", "starter": "def send_welcome_mail(user): print(\"메일 →\", user[\"email\"])\ndef issue_coupon(user):      print(\"쿠폰 →\", user[\"email\"])\ndef track_signup(user):      print(\"통계 +1\")\n\ndef sign_up(email):\n    user = {\"email\": email}\n    send_welcome_mail(user)               # 회원가입이 후속 작업을 전부 알고 있다\n    issue_coupon(user)\n    track_signup(user)\n    return user", "q": "<code>sign_up()<\/code>이 후속 작업을 <b>몰라도<\/b> 되고, 새 후속 작업을 추가할 때 <code>sign_up()<\/code>을 <b>고치지 않아도<\/b> 되게 바꿔 보세요.", "answer": "def send_welcome_mail(user): print(\"메일 →\", user[\"email\"])\ndef issue_coupon(user):      print(\"쿠폰 →\", user[\"email\"])\ndef track_signup(user):      print(\"통계 +1\")\n\nsignup_handlers = []                       # 구독자 목록 (옵저버)\n\ndef on_signup(fn):                         # 구독 등록 (데코레이터 문법은 선택)\n    signup_handlers.append(fn)\n    return fn\n\non_signup(send_welcome_mail)\non_signup(issue_coupon)\non_signup(track_signup)\n\ndef sign_up(email):\n    user = {\"email\": email}\n    for handler in list(signup_handlers):  # 복사본을 순회: 통지 도중 구독 변경에 안전\n        handler(user)\n    return user                            # sign_up()은 후속 작업이 뭔지 모른다\n\nsign_up(\"a@example.com\")                   # 새 후속 작업은 on_signup(...) 한 줄이면 끝"}, {"id": "w4-t2", "type": "table", "corner": "상태 \\ 이벤트", "cols": ["예약", "체크인", "종료", "취소"], "rows": ["비어 있음", "예약됨", "사용 중"], "q": "<b>구현 과제 2 (상태 설계).<\/b> 회의실 예약 시스템의 <b>상태 전이표<\/b>를 완성하세요. 각 칸에는 ‘다음 상태’ 또는 ‘불가’를 적습니다.", "hint": "이 표는 코드의 어디에(상태 클래스? dict?) 들어갈지도 생각해 보세요."}, {"id": "w4-t3", "type": "info", "html": "<p><b>구현 과제 3 (반복자, 선택·도전).<\/b> 시간이 남으면 해 보세요. 서버가 한 번에 한 쪽씩만 항목을 줍니다. (교재 15장 연습 2, 5.2절)<\/p><pre><code># 서버는 한 번에 한 쪽씩만 준다: 토큰 → (항목들, 다음 토큰). 마지막 쪽의 다음 토큰은 None.\nPAGES = {None: ([&quot;a&quot;, &quot;b&quot;], &quot;t1&quot;), &quot;t1&quot;: ([&quot;c&quot;], &quot;t2&quot;), &quot;t2&quot;: ([&quot;d&quot;, &quot;e&quot;], None)}\n\ndef fetch_page(token):\n    return PAGES[token]\n\ndef all_items():\n    # 여기를 작성하세요. 호출하는 쪽이 for item in all_items(): 로\n    # 쪽(page)이 몇 개인지 모른 채 항목을 하나씩 받을 수 있어야 합니다.\n    ...\n\nprint(list(all_items()))                   # [&#x27;a&#x27;, &#x27;b&#x27;, &#x27;c&#x27;, &#x27;d&#x27;, &#x27;e&#x27;] 가 나와야 합니다<\/code><\/pre>"}, {"id": "w4-t4", "type": "code", "starter": "# 서버는 한 번에 한 쪽씩만 준다: 토큰 → (항목들, 다음 토큰). 마지막 쪽의 다음 토큰은 None.\nPAGES = {None: ([\"a\", \"b\"], \"t1\"), \"t1\": ([\"c\"], \"t2\"), \"t2\": ([\"d\", \"e\"], None)}\n\ndef fetch_page(token):\n    return PAGES[token]\n\ndef all_items():\n    # 여기를 작성하세요. 호출하는 쪽이 for item in all_items(): 로\n    # 쪽(page)이 몇 개인지 모른 채 항목을 하나씩 받을 수 있어야 합니다.\n    ...\n\nprint(list(all_items()))                   # ['a', 'b', 'c', 'd', 'e'] 가 나와야 합니다", "optional": true, "q": "<b>[선택·도전]<\/b> <code>all_items()<\/code>를 <b>제너레이터<\/b>로 작성해, 호출하는 쪽이 쪽 수를 모른 채 <code>for<\/code>로 순회할 수 있게 하세요.", "answer": "PAGES = {None: ([\"a\", \"b\"], \"t1\"), \"t1\": ([\"c\"], \"t2\"), \"t2\": ([\"d\", \"e\"], None)}\n\ndef fetch_page(token):\n    return PAGES[token]\n\ndef all_items():\n    token = None\n    while True:\n        items, token = fetch_page(token)\n        yield from items                   # 항목을 하나씩 내어 준다 (필요할 때만 다음 쪽을 요청)\n        if token is None:                  # 마지막 쪽이면 끝\n            return\n\nprint(list(all_items()))                   # ['a', 'b', 'c', 'd', 'e']"}]}, {"key": "reflect", "title": "성찰", "en": "Reflecting", "minutes": 5, "intro": "이번 주의 배움을 돌아봅니다.", "items": [{"id": "w4-r2", "type": "text", "rows": 4, "recall": [{"id": "w3-gr", "label": "3주차 일반화(수정본):"}], "q": "<b>주 간 연결<\/b>: 위 상자의 지난주 일반화와 이번 주 일반화를 나란히 놓고, <b>공통된 구조<\/b>나 <b>서로 부딪치는 점<\/b>을 하나 찾아 쓰세요. 그리고 아직 헷갈리는 점도 적어 주세요."}, {"id": "w4-r3", "type": "text", "rows": 2, "q": "마지막 주(종합)에 <b>꼭 다루고 싶은 개념적 질문<\/b> 하나를 적어 보세요.", "hint": "한 사례를 넘어 적용되는 질문이면 좋아요. 예) ‘~는 어떤 조건에서 ~할까?’"}]}]}, {"n": 5, "concept": "균형", "title": "얼마나 넣을 것인가 — 변경 축만큼만", "subtitle": "패턴 비교와 조합 · 종합 설계", "overview": "열다섯 개 패턴을 다 아는 사람이 열다섯 개를 다 쓰는 것은 아닙니다. 마지막 주에는 지난 4주의 일반화를 하나로 엮고, <b>‘무엇을 넣고 무엇을 넣지 않을지’<\/b>를 근거와 함께 설계하는 종합 과제를 수행합니다.", "goals": ["닮은 패턴을 ‘누가 무엇을 결정하는가’라는 질문으로 구별할 수 있다.", "시스템의 변경 축을 세고, 축마다 가장 가벼운 해법을 고르며, 넣지 않은 패턴과 그 이유를 말할 수 있다.", "4주간의 일반화를 연결해 나만의 설계 원칙을 정리하고, 새로운 맥락에 전이할 수 있다."], "questions": {"factual": ["로봇 창고 사례에서 변경 축은 몇 개이고, 각각 어떤 해법이 선택되었는가?", "전략·상태, 데코레이터·프록시를 가르는 질문은 각각 무엇인가?"], "conceptual": ["패턴의 가치와 비용은 무엇에 의해 결정되는가?", "언어 기능이 패턴을 흡수하면 설계 판단은 어떻게 달라지는가?"], "debatable": ["“디자인 패턴은 파이썬에서는 대부분 불필요하다”는 주장에 어디까지 동의하는가?", "“초기에 확장성을 위해 패턴을 미리 넣어 두는 편이 낫다”는 주장은 타당한가?"]}, "patterns": [{"ch": 99, "name": "종합: 패턴 비교와 조합", "href": "../textbook/99-summary.html"}, {"ch": 0, "name": "서론", "href": "../textbook/00-intro.html"}], "product": "변경 축 분석표, 닮은 패턴 판별, 최종 일반화, 스마트 주차장 종합 설계서, 5주 성찰", "stages": [{"key": "engage", "title": "몰입", "en": "Tuning in", "minutes": 10, "intro": "‘다 넣은 설계안’을 마주하고, 도윤의 질문에 나는 어떻게 답할지 생각해 봅니다.", "items": [{"id": "w5-e0", "type": "info", "html": "<p><b>상황.<\/b> 물류 기업 한빛로지스의 피킹 로봇 창고는 여섯 가지 요구를 한꺼번에 받았고(아래), 개발자 도윤은 이를 하나씩 WMS 클래스에 분기로 넣다가 사고를 냈습니다. 신입 다온은 <b>열다섯 개 패턴을 모두 넣은 설계안<\/b>을 들고 왔습니다. 도윤은 질문 하나로 대답했습니다. “이 시스템에서 실제로 바뀌는 것이 몇 가지예요?” (교재 99장 2절)<\/p><pre><code>요구 ①  제조사가 둘이 되었다. Acme SDK는 mm 좌표·배터리 정수 %, RoboKo SDK는 칸 이름·배터리 0~1 실수\n요구 ②  유리 구역은 ‘가까운 칸 먼저’ 대신 ‘구역 순서대로 쓸기’ 경로를 쓰자 (운영팀)\n요구 ③  출고 전이면 주문을 취소할 수 있어야 한다 (고객센터)\n요구 ④  대시보드에 로봇 상태가 실시간으로 뜨고, 다음 분기엔 모바일 알림도 붙는다 (관제실)\n요구 ⑤  재고를 구역·랙·선반·칸으로 집계하되, 신축 동은 선반 아래 칸막이 단계가 하나 더 있다 (재무팀)\n요구 ⑥  배터리가 떨어지면 진행 중인 주문과 뒤엉키지 않고 충전을 보내자 (관제실)<\/code><\/pre>"}, {"id": "w5-e1", "type": "text", "recall": [{"id": "w4-r3", "label": "지난주 내가 만든 질문:"}], "rows": 4, "q": "<b>[지난주 내 질문]<\/b> 위 상자의 내 질문에 이번 주 활동으로 답할 수 있을지 한 줄로 예상해 보고, 이어서 아래에 답하세요. 도윤이 다온에게 한 질문에 <b>당신이라면 어떻게 대답<\/b>하겠습니까? 여섯 요구를 ‘변경 축’으로 묶어 본다면 몇 개가 되며, 열다섯 개를 다 넣는 것에 대해 어떤 의견인가요?"}]}, {"key": "find", "title": "조사", "en": "Finding out", "minutes": 25, "intro": "변경 축을 세고, 닮은 패턴을 구별하고, 파이썬이 흡수한 정도를 조사합니다.", "items": [{"id": "w5-f1", "type": "table", "corner": "변경 축 (요구)", "cols": ["후보 패턴", "가장 가벼운 형태", "넣지 않으면 생기는 고통"], "rows": ["① 제조사 SDK 차이 (구매팀)", "② 경로 알고리즘 (운영팀)", "③ 주문 대기·취소 (고객센터)", "④ 알림 채널 (관제실)", "⑤ 재고 계층 깊이 (재무팀)", "⑥ 배터리 대응 (관제실)"], "q": "여섯 변경 축마다 <b>패턴을 고르고, 가장 가벼운 형태<\/b>를 정해 보세요. 교재 99장 2.3절을 읽기 <b>전에<\/b> 먼저 시도해 보세요."}, {"id": "w5-f2", "type": "sort", "q": "<b>닮은 패턴 가르기<\/b>: 각 서술은 어느 패턴의 특징일까요?", "cards": ["관제 시스템이 <code>r.rule = careful<\/code>로 규칙을 갈아 끼운다. 로봇은 규칙이 바뀐 줄도 모른다", "<code>Normal.after_trip()<\/code>이 배터리를 보고 다음 상태(PowerSave)를 돌려준다", "이미 만들어진 드라이버를 받아 시간을 재고 위임한다", "실제 드라이버를 스스로 만들고, 처음 쓸 때까지 연결을 미룬다", "클라이언트가 만들어 둔 객체를 겹겹이 감싸 책임을 조합한다", "클라이언트는 실제 객체의 참조를 한 번도 갖지 않는다"], "buckets": ["전략", "상태", "데코레이터", "프록시"]}, {"id": "w5-f3", "type": "table", "corner": "패턴", "cols": ["파이썬 기능으로 대체되는 모습", "그래도 클래스·패턴으로 남기는 기준"], "rows": ["전략", "옵저버", "반복자", "싱글턴", "데코레이터(구조 패턴)", "템플릿 메서드"], "q": "각 패턴을 <b>파이썬이 얼마나 흡수<\/b>했는지, 그래도 남기는 기준은 무엇인지 지난 4주 내용을 떠올려 채워 보세요."}]}, {"key": "sort", "title": "조직", "en": "Sorting out", "minutes": 15, "intro": "4주간의 개념을 하나의 지도로 엮습니다.", "items": [{"id": "w5-s1", "type": "triples", "min": 8, "relations": ["를 격리한다", "를 옮긴다", "의 비용이다", "를 약속한다", "와 구별된다", "를 흡수한다", "에 비례한다", "를 결정한다"], "q": "<b>종합 개념 지도<\/b>: 변화, 책임, 경계, 상호작용, 균형, 변경 축, 간접층, 의도, 언어 기능 — 관계를 연결하세요(8개 안팎). 1~4주차 개념 지도에서 가져와도 좋습니다. 가장 중요한 연결 하나에는 <b>왜 그 관계인지 한 줄<\/b>을 덧붙이세요."}, {"id": "w5-s2", "type": "list", "n": 5, "hint": "예) 지금 바뀌는 것이 정말 두 가지 이상인가? (막아 주는 실수: 느낌만으로 패턴을 넣는 것)", "q": "<b>나의 패턴 선택 체크리스트<\/b>: 코드를 고치기 전에 스스로에게 던질 질문을 만들어 보세요. 각 질문 뒤에 괄호로 <b>이 질문이 막아 주는 실수<\/b>를 적으세요."}]}, {"key": "general", "title": "일반화", "en": "Making conclusions", "minutes": 20, "intro": "마지막 일반화를 쓰고, 반론에 맞서 봅니다.", "items": [{"id": "w5-g1", "type": "text", "rows": 5, "recall": [{"id": "w1-gr", "label": "1주(변화):"}, {"id": "w2-gr", "label": "2주(책임):"}, {"id": "w3-gr", "label": "3주(경계):"}, {"id": "w4-gr", "label": "4주(상호작용):"}], "q": "<b>나의 최종 일반화<\/b>: 위 상자의 1~4주차 일반화(수정본)를 엮어 ‘좋은 설계 판단’에 대한 나의 원칙을 두세 문장으로 써 보세요. 그리고 반례 하나를 받아 마지막 문장으로 고쳐 쓰세요.", "hint": "네 문장에 <b>반복되는 구조<\/b>가 무엇인지 먼저 찾고, ‘얻는 것 / 치르는 것 / 언제’를 고유명사 없이 써 보세요. (이번 주에는 문장 틀을 주지 않습니다.) 쓴 뒤 <b>짝이 붙여 준 반례 하나(없으면 스스로 찾은 반례)<\/b>와 <b>그 반례를 반영해 고친 마지막 문장<\/b>을 이어서 적으세요."}, {"id": "w5-g2", "type": "text", "rows": 7, "q": "<b>토론 준비<\/b>: “디자인 패턴은 파이썬에서는 대부분 불필요하다.” (1) 나의 입장(동의 / 부분 동의 / 반대) (2) 동의하는 근거 한 가지와 반박하는 근거 한 가지 (3) 반대편의 <b>가장 강한 반론<\/b>과 그에 대한 나의 응답 (4) 어떤 조건이 달라지면 입장을 바꿀 것인가", "hint": "1~4주 논쟁 문항에서 쓴 방식(입장·근거·반론·조건)을 그대로 쓰되, 이번에는 자신의 최종 일반화를 근거로 삼아 보세요."}]}, {"key": "transfer", "title": "전이", "en": "Going further", "minutes": 40, "intro": "종합 수행 과제: 새로운 시스템을 직접 설계합니다. <b>패턴을 ‘넣지 않는’ 선택<\/b>도 반드시 설명해야 합니다.", "items": [{"id": "w5-t0", "type": "info", "html": "<p><b>수행 과제 — 스마트 주차장.<\/b> 아래 여섯 가지 요구를 가진 시스템의 설계서를 작성합니다. (교재 99장 연습 2 참고)<\/p><pre><code>스마트 주차장 시스템의 요구\n ① 결제는 PG사 A( pay(plate, won) )와 B( charge({&quot;car&quot;: …, &quot;amount&quot;: …}) ) 두 곳을 쓰고, 계속 늘 수 있다\n ② 요금제는 일반·장기·전기차 할인이 있고, 운영자가 실행 중에 바꾼다\n ③ 입·출차 이벤트에 전광판·앱 푸시·통계가 각각 반응하며, 반응하는 쪽은 앞으로 늘어난다\n ④ 정산 시 층·구역·면 단위로 합계를 낸다 (건물마다 계층 깊이가 다르다)\n ⑤ 출구 게이트는 닫힘·열림·고장 상태에 따라 같은 신호에 다르게 반응한다\n ⑥ 운영 콘솔은 ‘입차 등록 → 요금 계산 → 결제’를 한 번에 호출하고 싶어 한다<\/code><\/pre>"}, {"id": "w5-t1", "type": "table", "corner": "요구", "cols": ["선택한 패턴 (또는 ‘넣지 않음’)", "변경 축 — 누가 왜 바꾸나", "가장 가벼운 형태"], "rows": ["① PG사 A·B 결제", "② 요금제 실행 중 교체", "③ 입출차 이벤트 반응", "④ 층·구역·면 계층 합계", "⑤ 출구 게이트 상태", "⑥ 운영 콘솔 한 번에 호출"], "q": "여섯 요구 각각에 <b>패턴·변경 축·가장 가벼운 형태<\/b>를 정해 설계표를 완성하세요."}, {"id": "w5-t2", "type": "text", "rows": 4, "q": "이 시스템에 <b>넣지 않은 패턴<\/b>을 두 가지 이상 들고, <b>왜 넣지 않았는지<\/b>(그 대신 무엇으로 충분한지) 설명하세요. 그리고 “초기에 확장성을 위해 패턴을 미리 넣어 두는 편이 낫다”는 반론에 한 문단으로 답하세요."}, {"id": "w5-t3", "type": "code", "starter": "# 시그니처만 스케치하세요 (본문은 ... 로 둡니다)\n# 예)\n# class PgAdapter(Protocol): ...", "q": "위 설계의 <b>핵심 클래스·함수 시그니처<\/b>를 파이썬으로 스케치하세요. (본문은 <code>...<\/code>로 두어도 됩니다)", "hint": "클래스 이름만 나열하지 말고, 요구와 연결해 주석으로 ‘①~⑥’을 표시해 보세요.", "answer": "from typing import Callable, Protocol\n\nclass Payment(Protocol):                       # ① 어댑터의 Target\n    def pay(self, plate: str, won: int) -> str: <script>"use strict";
/* 학생 로그인(학교 Google 계정). 학습지와 교재 사본이 같은 주소라 한 번 로그인하면 두 화면이 함께 쓴다.
   진도 전달은 로그인한 학교 계정이 있어야 한다. 서버 규칙(firestore.rules)이 도메인과 uid 를 다시 확인한다.
   필요한 전역: FB(fb.js). */
const StudentAuth = (() => {
  let user = null; const subs = [];
  const mine = u => (u && !u.isAnonymous && (u.email || "").toLowerCase().endsWith("@" + FB.domain)) ? u : null;
  const notify = () => subs.forEach(f => { try { f(user); } catch (e) {} });
  async function init() {
    try { user = mine(await FB.currentUser()); } catch (e) { user = null; }
    notify();

  }
  /* 로그인 창을 띄운다. 학교 계정이 아니면 바로 로그아웃하고 이유를 돌려준다. 성공하면 null, 실패하면 안내 문장. */
  async function login() {
    try {

      if (!mine(r.user)) { await FB.signOut(); return `학교 계정(@${FB.domain})으로 로그인해 주세요.`; }
      return null;
    } catch (e) {
      if (/popup-closed|cancelled|popup_closed/.test(e.code || "")) return null;
      return /popup-blocked/.test(e.code || "") ? "로그인 창이 막혔어요. 브라우저의 팝업 허용을 켜 주세요." : "로그인하지 못했어요: " + FB.fbErr(e);

  const key = base => base + "-" + (user ? user.uid : "anon");

})();

/* 이 화면을 보고 있는지(탭 가림·창 포커스). 브라우저가 알려 주는 두 신호만 쓴다:
     hidden = 다른 탭으로 옮겼거나 창을 최소화해 이 탭이 가려짐(visibilitychange),
     blur   = 이 탭은 보이지만 다른 창·프로그램을 눌러 포커스를 잃음(blur),
     on     = 보이고 포커스도 있음.
   무엇을 보고 있는지(주소·제목·내용)는 브라우저가 알려 주지 않으므로 수집하지 않는다.
   전달: 지금 상태(view)와 그 상태가 된 시각(viewAt), 이탈 횟수(leaves = on 에서 벗어난 횟수), 이탈한 시간 합계(awayMs).

const FocusTrack = (() => {
  const now = () => Date.now();
  const compute = () => document.visibilityState === "hidden" ? "hidden" : (document.hasFocus() ? "on" : "blur");

    const next = compute(); if (next === state) return;
    const t = now();

    else if (next === "on") { awayMs += t - awaySince; awaySince = 0; }                // 돌아옴

  const snapshot = () => ({ view: state, viewAt: since, leaves, awayMs: Math.round(awayMs + (state !== "on" && awaySince ? now() - awaySince : 0)) });
  return { snapshot, onChange: f => subs.push(f) };
})();

      addMsg("err", /resource-exhausted|너무 빨라|번까지|unavailable/.test(e.code + m) ? m.replace(/^.*?: /, "") : /failed-precondition/.test(e.code) ? "지금은 AI 도우미를 쓸 수 없어요. 선생님이 켜 주면 쓸 수 있어요."
        : /permission|unauth/.test(e.code) ? "학교 Google 계정으로 로그인해야 해요." : "답을 받지 못했어요. 잠시 뒤에 다시 시도해 주세요.");
    }
    setBusy(false); input.focus();
  }
  function autosize(t) { t.style.height = "auto"; t.style.height = Math.max(96, Math.min(180, t.scrollHeight)) + "px"; }      // 늘 여러 줄(최소 4줄)이 보이고, 길어지면 6~7줄까지 자란다

  /* ---------- 화면 ---------- */
  function build() {

      oninput: () => autosize(input), onkeydown: e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } } });
    const file = el("input", { type: "file", accept: "image/jpeg,image/png,image/webp", hidden: true, onchange: e => { pick(e.target.files[0]); e.target.value = ""; } });
    attach = el("button", { type: "button", class: "ai-ico", "aria-label": "사진 파일 첨부", title: "사진 파일 첨부", onclick: () => file.click() }, ico("add_photo_alternate"));
    const pasteBtn = el("button", { type: "button", class: "ai-ico", "aria-label": "클립보드의 이미지 붙여넣기", title: "클립보드의 이미지 붙여넣기", onclick: pasteFromClipboard }, ico("content_paste"));
    send = el("button", { type: "button", class: "ai-send", "aria-label": "보내기", title: "보내기", onclick: ask }, ico("send"));

    const login = el("div", { class: "ai-login", hidden: true }, "학교 Google 계정으로 로그인하면 쓸 수 있어요. ",
      el("button", { type: "button", class: "qbtn", onclick: async () => { const m = await StudentAuth.login(); if (m) addMsg("err", m); } }, ico("login"), "로그인"));
    const syncLogin = () => { login.hidden = !!StudentAuth.get(); };
    StudentAuth.onChange(syncLogin); syncLogin();
    panel = el("section", { class: "ai-panel", role: "dialog", "aria-label": "AI 도우미", hidden: true },
      el("header", {}, el("b", {}, ico("smart_toy", "fill"), "AI 도우미"),
        el("span", { class: "ai-hbtn" },
          el("button", { type: "button", class: "ai-ico", "aria-label": "대화 지우기", title: "대화 지우기", onclick: welcome }, ico("delete_sweep")),
          el("button", { type: "button", class: "ai-ico", "aria-label": "닫기", title: "닫기", onclick: toggle }, ico("close")))),
      el("p", { class: "ai-note" }, "질문과 사진, 지금 보는 화면의 글이 AI(Google Gemini)로 전달돼요. 주고받은 질문과 AI의 답은 선생님이 볼 수 있도록 기록돼요(사진 파일은 저장하지 않아요). 이름·학번·연락처 같은 개인정보는 쓰지 마세요. AI의 답은 틀릴 수 있으니 교재와 함께 확인하세요."),
      log, login, ctxChip, preview,
      el("div", { class: "ai-row" }, el("span", { class: "ai-tools" }, attach, pasteBtn), input, send, file),
      el("p", { class: "ai-hint" }, ico("image"), "사진: 이미지를 복사한 뒤 이 창에서 Ctrl+V(Mac은 Cmd+V), [붙여넣기] 버튼, 또는 끌어다 놓기로 올려요."), leftEl);
    // 창 어디에서든 이미지를 붙여넣거나(Ctrl/Cmd+V) 끌어다 놓을 수 있다

    panel.addEventListener("dragleave", e => { if (e.target === panel) panel.classList.remove("drop"); });

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 패턴 탐구 학습지</title>
<style>:root {
  --bg: #fbfaf7; --surface: #ffffff; --surface-2: #f3f1ec; --text: #1f2328; --muted: #656d76;
  --border: #dcd8cf; --accent: #2c5d8f; --accent-soft: #e6eef7; --accent-text: #ffffff;
  --ok: #2e7d4f; --ok-soft: #e4f3ea; --warn: #b4630f; --warn-soft: #fbeedd; --bad: #b3352b; --bad-soft: #fbe6e3;
  --teacher: #7a3e9d; --teacher-soft: #f3e9f9;
  --stage-1: #d9822b; --stage-2: #2c5d8f; --stage-3: #2e7d4f; --stage-4: #7a3e9d; --stage-5: #b3352b; --stage-6: #5b6770;
  --tok-comment: #6a737d; --tok-keyword: #a3195b; --tok-string: #1f6b3a; --tok-func: #6639ba;
  --tok-class: #8a4b08; --tok-number: #0b5c99; --tok-deco: #b3561d;
  --radius: 10px; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1c1f23; --surface-2: #23272c; --text: #e6e6e3; --muted: #9aa0a6;
    --border: #33383f; --accent: #8ab4e8; --accent-soft: #1f2a37; --accent-text: #0f1720;
    --ok: #7ccf9a; --ok-soft: #1a2c22; --warn: #f0a868; --warn-soft: #33261b; --bad: #f08c82; --bad-soft: #35201d;
    --teacher: #cf9be8; --teacher-soft: #2b2033;
    --tok-comment: #8b949e; --tok-keyword: #ff7b9c; --tok-string: #a5d6a7; --tok-func: #d2a8ff;
    --tok-class: #f0c674; --tok-number: #79c0ff; --tok-deco: #ffa657;
    --stage-1: #f0a868; --stage-2: #8ab4e8; --stage-3: #7ccf9a; --stage-4: #cf9be8; --stage-5: #f08c82; --stage-6: #a3adb5;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1c1f23; --surface-2: #23272c; --text: #e6e6e3; --muted: #9aa0a6;
  --border: #33383f; --accent: #8ab4e8; --accent-soft: #1f2a37; --accent-text: #0f1720;
  --ok: #7ccf9a; --ok-soft: #1a2c22; --warn: #f0a868; --warn-soft: #33261b; --bad: #f08c82; --bad-soft: #35201d;
  --teacher: #cf9be8; --teacher-soft: #2b2033;
  --tok-comment: #8b949e; --tok-keyword: #ff7b9c; --tok-string: #a5d6a7; --tok-func: #d2a8ff;
  --tok-class: #f0c674; --tok-number: #79c0ff; --tok-deco: #ffa657;
  --stage-1: #f0a868; --stage-2: #8ab4e8; --stage-3: #7ccf9a; --stage-4: #cf9be8; --stage-5: #f08c82; --stage-6: #a3adb5;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.7 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
a { color: var(--accent); text-underline-offset: 3px; }
code, pre, .mono { font-family: var(--mono); }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
pre {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
  overflow-x: auto; font-size: 13.5px; line-height: 1.55; margin: 10px 0;
}
pre code { background: none; padding: 0; font-size: inherit; }
button { font: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 6px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.small { padding: 2px 8px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }

/* 상단 바 */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
}
.topbar h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.topbar .grow { flex: 1 1 20px; }
.topbar input.id {
  border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px;
  padding: 4px 8px; font: inherit; font-size: 14px; width: 110px;
}
.topbar input.id.sm { width: 64px; }
.savestate { font-size: 13px; color: var(--muted); }
.savestate.dirty { color: var(--warn); font-weight: 600; }
.savestate.clean { color: var(--ok); }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px 0; max-width: 1100px; margin: 0 auto; }
.tab {
  flex: 1 1 130px; text-align: left; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text);
}
.tab small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.tab b { font-size: 14px; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.bar { height: 5px; background: var(--surface-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }

main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 80px; }

/* 주 머리 */
.hero {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; margin-bottom: 16px;
}
.hero .kicker { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.hero h2 { margin: 2px 0 4px; font-size: 24px; letter-spacing: -.02em; }
.hero p { margin: 6px 0; }
.concept {
  display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 20px;
  padding: 2px 12px; font-weight: 700; font-size: 14px; margin-right: 6px;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
.card { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.card h4 { margin: 0 0 4px; font-size: 14px; }
.card ul { margin: 4px 0; padding-left: 20px; }
.card li { margin: 2px 0; }
.qtag { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 10px; margin-right: 4px; color: #fff; }
.qtag.f { background: var(--stage-2); } .qtag.c { background: var(--stage-3); } .qtag.d { background: var(--stage-5); }
.pattern-links a { display: inline-block; margin: 2px 8px 2px 0; font-size: 14px; }

/* 단계 */
.stage { margin: 22px 0; }
.stage > header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; position: sticky; top: 52px; background: var(--bg); padding: 6px 0; z-index: 5; }
.stage .badge {
  background: var(--sc, var(--accent)); color: #fff; border-radius: 8px; padding: 2px 10px; font-weight: 700; font-size: 14px;
}
.stage[data-s="1"] { --sc: var(--stage-1); } .stage[data-s="2"] { --sc: var(--stage-2); }
.stage[data-s="3"] { --sc: var(--stage-3); } .stage[data-s="4"] { --sc: var(--stage-4); }
.stage[data-s="5"] { --sc: var(--stage-5); } .stage[data-s="6"] { --sc: var(--stage-6); }
.stage h3 { margin: 0; font-size: 18px; }
.stage .min { color: var(--muted); font-size: 13px; }
.stage .intro { color: var(--muted); margin: 0 0 10px; }
.item {
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--sc, var(--accent));
  border-radius: var(--radius); padding: 14px 18px; margin: 12px 0;
}
.item.done { border-left-color: var(--ok); }
.item .q { margin: 0 0 8px; font-weight: 600; }
.item .q .no { color: var(--sc, var(--accent)); margin-right: 6px; font-family: var(--mono); font-size: 13px; }
.item .hint { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.item.info { background: var(--surface-2); border-left-style: dashed; }
.item.info .q { font-weight: 400; }
textarea, input[type="text"], select {
  width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  font: inherit; font-size: 15px; padding: 7px 10px; line-height: 1.55;
}
textarea { resize: vertical; min-height: 44px; overflow: hidden; }
textarea.code { font-family: var(--mono); font-size: 13.5px; line-height: 1.5; min-height: 160px; tab-size: 4; white-space: pre; overflow: auto; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.opts { display: grid; gap: 6px; margin: 6px 0 10px; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--bg); }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 6px; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); }
.why { margin-top: 6px; }
.why label { font-size: 13px; color: var(--muted); display: block; }
.tbl-wrap { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
table.grid th, table.grid td { border: 1px solid var(--border); padding: 5px 7px; vertical-align: top; text-align: left; }
table.grid thead th { background: var(--surface-2); }
table.grid tbody th { background: var(--surface-2); width: 17%; font-weight: 600; }
table.grid td textarea { font-size: 14px; min-height: 56px; }
.sortrow { display: grid; grid-template-columns: 1fr 190px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.sortrow:last-child { border-bottom: 0; }
.triple { display: grid; grid-template-columns: 1fr 1fr 1fr 30px; gap: 6px; margin: 5px 0; align-items: center; }
.triple .arrow { text-align: center; color: var(--muted); }
.listrow { display: grid; grid-template-columns: 26px 1fr 30px; gap: 6px; margin: 5px 0; align-items: center; }
.listrow .n { color: var(--muted); text-align: right; font-family: var(--mono); font-size: 13px; }
.xbtn { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; }
.xbtn:hover { color: var(--bad); }
.scale-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.scale-row:last-child { border-bottom: 0; }
.scale-pts { display: flex; gap: 4px; }
.scale-pts label { display: block; }
.scale-pts input { position: absolute; opacity: 0; }
.scale-pts span { display: block; width: 34px; text-align: center; padding: 3px 0; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--bg); }
.scale-pts input:checked + span { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.addbtn { margin-top: 4px; }
.filled-mark { float: right; font-size: 12px; color: var(--muted); }
.item.done .filled-mark { color: var(--ok); }

/* 교사 코멘트 / 정답 */
.fb { margin-top: 10px; background: var(--teacher-soft); border-left: 4px solid var(--teacher); border-radius: 8px; padding: 8px 12px; }
.fb b { color: var(--teacher); }
.fb .mk { font-size: 18px; margin-right: 4px; }
.sample { margin-top: 10px; background: var(--ok-soft); border-left: 4px solid var(--ok); border-radius: 8px; padding: 8px 12px; }
.sample > b, .tnote > b { display: block; font-size: 13px; color: var(--ok); margin-bottom: 2px; }
.tnote { margin-top: 10px; background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14.5px; }
.tnote > b { color: var(--warn); }
.val { white-space: pre-wrap; word-break: break-word; }
.val.empty, .empty { color: var(--muted); font-style: italic; }
.val-code { margin: 4px 0; }
table.ro { border-collapse: collapse; width: 100%; font-size: 14px; }
table.ro th, table.ro td { border: 1px solid var(--border); padding: 4px 8px; vertical-align: top; text-align: left; white-space: pre-wrap; }
table.ro th { background: var(--surface-2); }
.ro-opt { padding: 3px 8px; border-radius: 6px; margin: 2px 0; }
.ro-opt.on { background: var(--accent-soft); font-weight: 600; }
.ro-opt.key::after { content: " ✔ 정답"; color: var(--ok); font-weight: 700; font-size: 12px; }
.pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 700; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.part { background: var(--warn-soft); color: var(--warn); } .pill.none { background: var(--surface-2); color: var(--muted); }

.banner { background: var(--teacher-soft); border: 1px solid var(--teacher); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff;
  padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 50; opacity: 0; transition: opacity .25s; pointer-events: none;
}
.toast.on { opacity: .95; }
.dropzone { position: fixed; inset: 0; background: rgba(44,93,143,.85); color: #fff; display: none; place-items: center; font-size: 26px; z-index: 60; }
.dropzone.on { display: grid; }
.lead { color: var(--muted); }
.theme-toggle { font-size: 16px; }
details.fold { margin: 8px 0; }
details.fold > summary { cursor: pointer; font-weight: 600; color: var(--accent); }

@media (max-width: 640px) {
  .triple { grid-template-columns: 1fr; } .triple .arrow { display: none; }
  .sortrow { grid-template-columns: 1fr; }
  .stage > header { position: static; }
}
@media print {
  .topbar, .tabs, .toast, .dropzone, .addbtn, .xbtn, .no-print { display: none !important; }
  body { background: #fff; color: #000; font-size: 12px; }
  .item, .hero { break-inside: avoid; border-color: #aaa; }
  textarea { border: 1px solid #aaa; overflow: visible; }
  .stage > header { position: static; }
}

/* 앞서 쓴 글 상자, 선택 문항 표시 */
.recall { background: var(--surface-2); border: 1px dashed var(--border); border-radius: 8px; padding: 8px 12px; margin: 0 0 10px; font-size: 14px; }
.recall .val { margin: 4px 0 0; white-space: pre-wrap; }
.recall .rl { color: var(--accent); font-weight: 600; }
.opt-tag { display: inline-block; border: 1px solid var(--muted); color: var(--muted); border-radius: 10px; padding: 0 7px; font-size: 12px; margin-right: 6px; font-weight: 400; }

/* ---- Firebase 제출·교사 로그인·AI 초안 ---- */
[hidden] { display: none !important; }
.gate { max-width: 420px; margin: 18vh auto; text-align: center; padding: 0 16px; }
.gate .err { color: var(--bad); margin-top: 12px; }
.ai-badge { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 700; background: var(--warn-soft); color: var(--warn); }
.ai-badge.done { background: var(--ok-soft); color: var(--ok); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
.panel h3 { margin: 0 0 8px; }
.wk-toggles { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.wk-toggles label { display: flex; gap: 6px; align-items: center; }
.status-open { color: var(--ok); font-weight: 700; } .status-closed { color: var(--bad); font-weight: 700; }
</style>
<style>/* 파이썬 실행·편집기(pyrun.js) 공용 스타일. 교재와 탐구 학습지의 색 토큰을 모두 받아 쓴다. */
.pr, .pr-modal {
  --pr-mono: var(--font-code, var(--mono, ui-monospace, Menlo, Consolas, monospace));
  --pr-bad: var(--bad, #b3352b); --pr-ok: var(--ok, #2f6b3c);
  --pr-bg: var(--code-bg, var(--surface-2, #f3f1ec)); --pr-fg: var(--code-text, var(--text, #1d1d1d));
  --pr-on-accent: var(--accent-text, #fff);
  --pr-lh: 22px;   /* 편집기 줄 높이. 글자·행 번호·점선이 같은 격자에 놓이도록 정수 px 로 고정 */
}
.pr { margin: 12px 0; border: 1px solid var(--border); border-radius: var(--radius, 10px); overflow: hidden; background: var(--pr-bg); }
.pr-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.pr-btn {
  font-family: inherit; font-size: 13px; line-height: 1.4; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 6px; padding: 3px 10px; cursor: pointer;
}
.pr-btn:hover:not(:disabled) { border-color: var(--accent); }
.pr-btn:disabled { opacity: .5; cursor: default; }
.pr-btn.run { border-color: var(--pr-ok); color: var(--pr-ok); font-weight: 700; }
.pr-btn.stop { border-color: var(--pr-bad); color: var(--pr-bad); font-weight: 700; }
.pr-btn.ex { border-color: var(--accent); color: var(--accent); }
.pr-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--pr-on-accent); font-weight: 700; }
.pr-btn.small { padding: 0 8px; font-size: 12px; }
.pr-status { font-size: 12.5px; color: var(--muted); margin-left: 4px; }
textarea.pr-ta {
  display: block; width: 100%; border: 0; border-radius: 0; resize: vertical; min-height: 120px; max-height: 560px;
  background: var(--pr-bg); color: var(--pr-fg); padding: 14px 16px; margin: 0;
  font: 13.5px/var(--pr-lh) var(--pr-mono); tab-size: 4; white-space: pre; overflow: auto; outline: none;
}
textarea.pr-ta:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.pr-out { border-top: 1px solid var(--border); background: var(--surface); }
.pr-outhead { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; font-size: 12.5px; color: var(--muted); border-bottom: 1px dashed var(--border); }
.pr-pre { margin: 0; padding: 10px 16px; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 13px/1.55 var(--pr-mono); color: var(--text); background: none; border: 0; border-radius: 0; }
.pr-err { color: var(--pr-bad); }
.pr-note, .pr-dim { color: var(--muted); }

/* 문법 강조 층: 투명 글자의 textarea 아래에 같은 글꼴·여백의 색칠된 pre 를 겹친다. 두 칸의 글꼴·여백·줄 높이는 반드시 같아야 한다. */
.pr-stack { position: relative; background: var(--pr-bg); }
.pr-stack pre.pr-hl, .pr-stack textarea.pr-ta {
  font: 13.5px/var(--pr-lh) var(--pr-mono); tab-size: 4; padding: 14px 16px; margin: 0; border: 0; border-radius: 0; letter-spacing: 0;
  white-space: pre; word-spacing: 0; text-indent: 0;
}
.pr-stack pre.pr-hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--pr-fg); background: none; }
.pr-stack pre.pr-hl code { font: inherit; background: none; padding: 0; color: inherit; }
.pr-stack textarea.pr-ta { position: relative; background: transparent; color: transparent; caret-color: var(--pr-fg); }
.pr-stack textarea.pr-ta::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: transparent; }

/* 행 번호 칸 + 줄 사이 점선. 행 번호 칸(.pr-gutter)과 강조 층(.pr-hl)은 textarea 와 같은 글꼴·줄 높이·위쪽 여백을 써야 한다. */
.pr-edit { display: flex; align-items: stretch; }
.pr-edit > .pr-stack { flex: 1; min-width: 0; }
.pr-gutter {
  position: relative; flex: none; background: var(--surface-2); border-right: 1px solid var(--border);
  font: 13.5px/var(--pr-lh) var(--pr-mono); color: var(--muted); user-select: none; -webkit-user-select: none;
}
.pr-gutter pre.pr-gutter-pre {
  position: absolute; inset: 0; margin: 0; padding: 14px 10px 40px 0; overflow: hidden; text-align: right;
  font: inherit; color: inherit; background: none; border: 0; border-radius: 0; white-space: pre; tab-size: 4;
}
.pr-gutter code, .pr-stack pre.pr-hl code { position: relative; display: block; isolation: isolate; }
.pr-stack pre.pr-hl code { min-width: max-content; }
.pr-gutter code::before, .pr-stack pre.pr-hl code::before {
  content: ""; position: absolute; top: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--pr-lh) - 1px), var(--pr-rule, color-mix(in srgb, var(--muted, #888) 55%, transparent)) calc(var(--pr-lh) - 1px), var(--pr-rule, color-mix(in srgb, var(--muted, #888) 55%, transparent)) var(--pr-lh));
  -webkit-mask-image: repeating-linear-gradient(to right, #000 0, #000 2px, transparent 2px, transparent 5px);
          mask-image: repeating-linear-gradient(to right, #000 0, #000 2px, transparent 2px, transparent 5px);
}
.pr-gutter code::before { left: 0; right: -10px; bottom: 0; }

/* 문법 강조 토큰 (pyhl.js 가 만든다). 색은 --tok-* 변수로만 정한다 → 라이트/다크 자동. 변수가 없으면 var() 의 두 번째 값(라이트 기본색)을 쓴다. */
.token.comment { color: var(--tok-comment, #6a737d); font-style: italic; }
.token.string { color: var(--tok-string, #1f6b3a); }
.token.triple-quoted-string { color: var(--tok-comment, #6a737d); }
.token.string-interpolation { color: var(--pr-fg, inherit); }
.token.keyword { color: var(--tok-keyword, #a3195b); }
.token.function, .token.builtin { color: var(--tok-func, #6639ba); }
.token.class-name { color: var(--tok-class, #8a4b08); }
.token.number, .token.boolean { color: var(--tok-number, #0b5c99); }
.token.decorator { color: var(--tok-deco, #b3561d); }
.token.operator, .token.punctuation { color: var(--muted, #656d76); }

<script>"use strict";
/* 파이썬 문법 강조 공용 모듈 (교재 textbook/ 과 탐구 학습지 inquiry/ 가 함께 쓴다). 외부 라이브러리·네트워크 없이 동작한다.
   토큰 클래스 이름은 Prism 과 같다(.token.keyword 등). 색은 pyrun.css 의 --tok-* 변수만 쓰므로 다크 모드가 자동으로 맞는다.
   공개 API: PyHL.html(code) → 색칠한 HTML 문자열 · PyHL.apply(root) → root 안의 code.language-python 을 색칠한다 */
const PyHL = (function () {
  const KEYWORDS = new Set(("and as assert async await break class continue def del elif else except finally for from global if import " +
    "in is lambda nonlocal not or pass raise return try while with yield match case").split(" "));
  const CONSTS = new Set(["True", "False", "None"]);
  const BUILTINS = new Set(("abs all any bool bytes callable chr dict dir divmod enumerate filter float format frozenset getattr hasattr hash " +
    "id input int isinstance issubclass iter len list map max min next object open ord pow print property range repr reversed round set setattr " +
    "slice sorted staticmethod classmethod str sum super tuple type vars zip self cls NotImplemented Ellipsis " +
    "Exception ValueError TypeError KeyError IndexError AttributeError RuntimeError NotImplementedError StopIteration ZeroDivisionError").split(" "));

  /* 한 번에 한 토큰씩 앞에서부터 읽는다. 순서가 중요하다: 긴 문자열·주석을 먼저 잡아야 그 안의 키워드가 색칠되지 않는다. */
  const RE = new RegExp([
    "(#[^\\n]*)",                                                                           // 1 주석
    "((?:[rRbBuUfF]{1,2})?(?:\"\"\"[\\s\\S]*?(?:\"\"\"|$)|'''[\\s\\S]*?(?:'''|$)))",       // 2 삼중 따옴표(독스트링)
    "((?:[rRbBuUfF]{1,2})?(?:\"(?:\\\\.|[^\"\\\\\\n])*\"?|'(?:\\\\.|[^'\\\\\\n])*'?))",     // 3 문자열
    "(^[ \\t]*@[A-Za-z_][\\w.]*)",                                                          // 4 데코레이터
    "(\\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|\\d[\\d_]*\\.?[\\d_]*(?:[eE][+-]?\\d+)?j?)\\b|\\.\\d[\\d_]*)", // 5 숫자
    "([A-Za-z_][A-Za-z_0-9]*)",                                                             // 6 식별자
    "([+\\-*/%=<>!&|^~:]+)",                                                                // 7 연산자
    "([()\\[\\]{},.;])",                                                                    // 8 구두점
  ].join("|"), "gm");

  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const span = (cls, s) => '<span class="token ' + cls + '">' + esc(s) + "</span>";

  /* f-문자열의 {표현식} 은 문자열 색에서 빼 준다. */
  function fstring(s) {
    if (!/^[rRbBuU]*[fF]/.test(s)) return span("string", s);
    return s.split(/(\{\{|\}\}|\{[^{}\n]*\})/).map((p, i) => i % 2 && p.length > 2 && p[1] !== "{" ?
      '<span class="token string-interpolation">' + esc(p) + "</span>" : span("string", p)).join("");
  }

  function html(code) {
    let out = "", last = 0, prev = "", m;           // prev: 직전 의미 있는 토큰(def/class 뒤 이름 판별용)
    RE.lastIndex = 0;
    while ((m = RE.exec(code))) {
      if (m.index > last) out += esc(code.slice(last, m.index));
      const t = m[0]; last = RE.lastIndex;
      if (m[1] != null) out += span("comment", t);
      else if (m[2] != null) out += /^[rRbBuU]*[fF]/.test(t) ? fstring(t).replace(/class="token string"/g, 'class="token triple-quoted-string string"') : span("triple-quoted-string string", t);
      else if (m[3] != null) out += fstring(t);
      else if (m[4] != null) out += esc(t.slice(0, t.indexOf("@"))) + span("decorator", t.slice(t.indexOf("@")));
      else if (m[5] != null) out += span("number", t);
      else if (m[6] != null) {
        const next = code.slice(last).match(/^[ \t]*(\()?/)[1];
        if (prev === "def") out += span("function", t);
        else if (prev === "class") out += span("class-name", t);
        else if (KEYWORDS.has(t)) out += span("keyword", t);
        else if (CONSTS.has(t)) out += span("boolean", t);
        else if (BUILTINS.has(t)) out += span("builtin", t);
        else if (next && prev !== ".") out += span("function", t);        // 일반 호출 f(...)
        else if (next) out += span("function", t);                        // 메서드 호출 obj.f(...)
        else if (/^[A-Z][A-Za-z0-9]*$/.test(t) && /[a-z]/.test(t)) out += span("class-name", t);   // CamelCase 는 클래스로 본다
        else out += esc(t);
        prev = t;
        continue;
      }
      else if (m[7] != null) out += span("operator", t);
      else out += span("punctuation", t);
      prev = "";
    }
    return out + esc(code.slice(last));
  }

  function apply(root) {
    (root || document).querySelectorAll("code.language-python:not([data-hl])").forEach(c => {
      c.innerHTML = html(c.textContent); c.dataset.hl = "1";
    });
  }

  return { html, apply };
})();
</script>
<script>"use strict";
/* 브라우저 안에서 파이썬을 실행·편집하는 공용 모듈 (교재 textbook/ 과 탐구 학습지 inquiry/ 가 함께 쓴다).
   - Pyodide(WebAssembly 파이썬)를 Web Worker 에서 돌린다. 무한 루프도 '중지'로 끊을 수 있다.
   - 처음 실행할 때 한 번만 내려받고(약 10MB) 이후에는 브라우저 캐시를 쓴다.
   공개 API: PyRun.run(code, onChunk) · PyRun.stop() · PyRun.makeRunner(getCode) · PyRun.mountEditor(opts) · PyRun.showExample(opts) */
const PyRun = (function () {
  const PYODIDE_BASE = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";

  /* Pyodide 는 스레드를 만들 수 없다. 교재 예제의 threading 은 '순차 실행'으로 흉내 낸다(경쟁 상태는 재현되지 않음). */
  const SHIM = [
    "import threading as _t",
    "def _start(self):",
    "    self.run()",
    "_t.Thread.start = _start",
    "_t.Thread.join = lambda self, timeout=None: None",
    "_t.Barrier.wait = lambda self, timeout=None: 0",
  ].join("\n");

  function workerMain() {
    let py = null;
    self.onmessage = async function (e) {
      const m = e.data;
      try {
        if (m.type === "init") {
          importScripts(m.base + "pyodide.js");
          py = await loadPyodide({ indexURL: m.base });
          await py.runPythonAsync(m.shim);
          postMessage({ type: "ready" });
        } else if (m.type === "run") {
          py.setStdout({ batched: s => postMessage({ type: "out", id: m.id, text: s + "\n" }) });
          py.setStderr({ batched: s => postMessage({ type: "out", id: m.id, text: s + "\n", err: true }) });
          const g = py.globals.get("dict")();
          g.set("__name__", "__main__");
          try {
            await py.runPythonAsync(m.code, { globals: g });
            postMessage({ type: "done", id: m.id, ok: true });
          } catch (err) {
            let msg = String((err && err.message) || err);
            const i = msg.indexOf('File "<exec>"');
            if (i >= 0) msg = "Traceback (most recent call last):\n  " + msg.slice(i);
            if (/SystemExit/.test(msg)) postMessage({ type: "done", id: m.id, ok: true });
            else postMessage({ type: "done", id: m.id, ok: false, err: msg.trimEnd() });
          } finally { g.destroy(); }
        }
      } catch (err) {
        postMessage({ type: "fatal", message: String((err && err.message) || err) });
      }
    };
  }

  let worker = null, ready = null, cur = null, seq = 0, chain = Promise.resolve();

  function boot(onStatus) {
    if (ready) return ready;
    ready = new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob(["(" + workerMain.toString() + ")()"], { type: "text/javascript" }));
      worker = new Worker(url);
      worker.onmessage = e => {
        const m = e.data;
        if (m.type === "ready") resolve();
        else if (m.type === "fatal") { reject(new Error(m.message)); if (cur) finish({ ok: false, err: m.message }); }
        else if (cur && m.id === cur.id) {
          if (m.type === "out") cur.onChunk && cur.onChunk(m.text, !!m.err);
          else if (m.type === "done") finish({ ok: m.ok, err: m.err });
        }
      };
      worker.onerror = ev => { reject(new Error("파이썬 실행기를 시작하지 못했습니다. 인터넷 연결을 확인하세요.")); };
      worker.postMessage({ type: "init", base: PYODIDE_BASE, shim: SHIM });
    });
    ready.catch(() => { reset(); });
    return ready;
  }
  function reset() { if (worker) worker.terminate(); worker = null; ready = null; }
  function finish(res) { const c = cur; cur = null; if (c) c.resolve(res); }

  /* 코드를 실행한다. 한 번에 하나씩 차례로 실행한다. 반환: Promise<{ok, err?, stopped?}> */
  function run(code, onChunk, onStatus) {
    const job = chain.then(async () => {
      try {
        if (!ready) onStatus && onStatus("loading");
        await boot();
      } catch (e) { return { ok: false, err: e.message }; }
      onStatus && onStatus("running");
      return new Promise(resolve => {
        cur = { id: ++seq, resolve, onChunk };
        worker.postMessage({ type: "run", id: cur.id, code });
      });
    });
    chain = job.catch(() => {});
    return job;
  }
  /* 실행 중인 코드를 끊는다(실행기를 새로 만든다). 다음 실행 때 캐시에서 빠르게 다시 뜬다. */
  function stop() { if (cur) { const c = cur; reset(); cur = null; c.resolve({ ok: false, stopped: true }); } }

  /* ---------- UI ---------- */
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {
      const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
      try { document.execCommand("copy") ? res() : rej(); } catch (e) { rej(e); } t.remove();
    });
  }
  function flash(btn, text) { const old = btn.dataset.label || btn.textContent; btn.dataset.label = old; btn.textContent = text; clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = old; }, 1300); }
  /* 높이를 내용에 맞춘다. 가로 스크롤바가 생기면 그만큼 더 키워야 세로 스크롤바가 덩달아 생기지 않는다. */
  function fit(t) { t.style.height = "auto"; const bar = t.offsetHeight - t.clientHeight; t.style.height = Math.min(t.scrollHeight + bar + 2, 560) + "px"; }

  const NOTES = [
    [/\bthreading\b/, "ℹ️ 브라우저에서는 스레드를 만들 수 없어, 스레드를 차례대로 실행하는 방식으로 대신합니다. (경쟁 상태는 재현되지 않습니다)"],
    [/\bsubprocess\b/, "ℹ️ 브라우저에서는 다른 프로그램(subprocess)을 실행할 수 없어 오류가 날 수 있습니다."],
  ];

  /* 실행 버튼·중지 버튼·상태 표시·출력 칸 한 벌. 편집기(mountEditor)와 읽기 전용 코드 블록(교재의 예제 코드)이 함께 쓴다.
     getCode() 가 돌려주는 코드를 실행하고, 결과는 outBox 에 쌓는다. outBox 는 호출한 쪽이 원하는 자리에 붙인다. */
  function makeRunner(getCode) {
    const status = h("span", { class: "pr-status" });
    const bRun = h("button", { class: "pr-btn run", type: "button", title: "실행 (Ctrl/⌘ + Enter)" }, "▶ 실행");
    const bStop = h("button", { class: "pr-btn stop", type: "button", hidden: true }, "■ 중지");
    const outPre = h("pre", { class: "pr-pre" });
    const outBox = h("div", { class: "pr-out", hidden: true }, h("div", { class: "pr-outhead" }, h("span", {}, "출력"),
      h("button", { class: "pr-btn small", type: "button", onclick: () => { outBox.hidden = true; outPre.textContent = ""; } }, "지우기")), outPre);
    let busy = false;
    function setBusy(b) { busy = b; bRun.disabled = b; bStop.hidden = !b; }
    function go() {
      if (busy) return;
      const code = getCode(); outPre.textContent = ""; outBox.hidden = false;
      const note = NOTES.filter(([re]) => re.test(code)).map(n => n[1]);
      if (note.length) outPre.append(h("span", { class: "pr-note" }, note.join("\n") + "\n"));
      setBusy(true);
      const t0 = performance.now();
      PyRun.run(code, (text, isErr) => { outPre.append(isErr ? h("span", { class: "pr-err" }, text) : document.createTextNode(text)); },
        st => { status.textContent = st === "loading" ? "파이썬을 불러오는 중… (처음 한 번, 몇 초 걸려요)" : "실행 중…"; })
        .then(res => {
          setBusy(false);
          if (res.stopped) { outPre.append(h("span", { class: "pr-err" }, "■ 사용자가 중지했습니다.\n")); status.textContent = ""; return; }
          if (!res.ok) outPre.append(h("span", { class: "pr-err" }, res.err + "\n"));
          else if (!outPre.textContent.replace(/^ℹ️.*\n/, "").trim()) outPre.append(h("span", { class: "pr-dim" }, "(출력 없음 — print() 로 결과를 찍어 보세요)\n"));
          status.textContent = (res.ok ? "✔ 끝남 " : "✖ 오류 ") + Math.round(performance.now() - t0) + "ms";
        });
    }
    bRun.addEventListener("click", go);
    bStop.addEventListener("click", () => PyRun.stop());
    return { bRun, bStop, status, outBox, go };
  }

  /* 편집 가능한 코드 칸 + 실행 + 출력 (+ 예시 코드 버튼).
     opts: {code, starter, example, exampleTitle, onChange, minRows, label, resettable} */
  function mountEditor(opts) {
    const starter = opts.starter == null ? opts.code || "" : opts.starter;
    const ta = h("textarea", { class: "pr-ta", spellcheck: "false", autocapitalize: "off", autocomplete: "off", "aria-label": opts.label || "파이썬 코드 편집기", rows: opts.minRows || 6 });
    ta.value = opts.code == null ? starter : opts.code;
    const { bRun, bStop, status, outBox, go } = makeRunner(() => ta.value);
    const bReset = h("button", { class: "pr-btn", type: "button", title: "처음 코드로 되돌리기" }, "↺ 처음 코드");
    const bCopy = h("button", { class: "pr-btn", type: "button", title: "내 코드 복사" }, "복사");

      const out = v.slice(a, b).split("\n").map((ln, i) => {
        let d = 0;

        const s = ta.selectionStart, line = ta.value.slice(ta.value.lastIndexOf("\n", s - 1) + 1, s);

  /* 정답 예시 코드 팝업. 코드는 드래그해서 복사하거나 '복사' 버튼으로 복사한다. 닫기 버튼·Esc·바깥 클릭으로 닫힌다. */
  let modal = null;
  function showExample(o) {
    closeExample();
    const prev = o.opener || document.activeElement;
    const pre = h("pre", { class: "pr-modal-code", tabindex: "0" }, h("code", { class: "language-python" }, o.code));
    if (typeof PyHL !== "undefined") PyHL.apply(pre);

    const bClose = h("button", { class: "pr-btn primary", type: "button" }, "닫기");

    bCopy.addEventListener("click", () => copyText(o.code).then(() => flash(bCopy, "✔ 복사됨"), () => flash(bCopy, "복사 실패 — 직접 선택해 복사하세요")));

})();

<script>// 이 파일을 firebase-config.js 로 복사해 Firebase 콘솔의 웹 앱 설정값을 채운 뒤 `python3 inquiry/build.py` 를 실행하세요.
// (웹 앱 config는 비밀이 아니지만, 접근 통제는 firestore.rules·functions가 맡습니다.)
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyB4Uq99CbKzTgHaqTR_AHXPXjKoXlN1AYc",
  authDomain: "dshs-inquiry-feedback-21382.firebaseapp.com",
  projectId: "dshs-inquiry-feedback-21382",

};
window.FIREBASE_REGION = "asia-northeast3";   // Functions 지역(firebase/functions/config.js의 REGION과 같아야 함)
window.TEACHER_DOMAIN = "ts.hs.kr";           // 교사 학교 계정 도메인(firestore.rules·functions/config.js와 같게)

"use strict";
/* Firebase 어댑터(학생·교사 공용). 빌드에서 firebase-config.js가 있을 때만 포함된다.
   SDK는 고정 버전 CDN에서 필요할 때 불러온다. 모든 규칙 검사는 서버(firestore.rules, functions)가 한다. */
const FB = (() => {
  const VER = "11.10.0", BASE = `https://www.gstatic.com/firebasejs/${VER}/`;
  const REGION = window.FIREBASE_REGION || "asia-northeast3", DOMAIN = window.TEACHER_DOMAIN || "ts.hs.kr";
  const EMU = /[?&]emulator\b/.test(location.search);
  let M = null;
  const sid = st => [st.klass, st.number, st.name].map(safeName).filter(Boolean).join("_");
  const wkOf = id => { const m = /^w(\d+)-/.exec(id); return m ? Number(m[1]) : 0; };

  async function load() {
    if (M) return M;
    const [app, auth, fs, fn] = await Promise.all(["app", "auth", "firestore", "functions"].map(n => import(`${BASE}firebase-${n}.js`)));
    const a = app.initializeApp(window.FIREBASE_CONFIG), au = auth.getAuth(a), db = fs.getFirestore(a), fx = fn.getFunctions(a, REGION);
    if (EMU) { auth.connectAuthEmulator(au, "http://localhost:9099", { disableWarnings: true }); fs.connectFirestoreEmulator(db, "localhost", 8080); fn.connectFunctionsEmulator(fx, "localhost", 5001); }
    return (M = { app, auth, fs, fn, au, db, fx });
  }

  /* ---------- 공통 ---------- */
  async function anon() {
    const m = await load(); await m.au.authStateReady();
    if (!m.au.currentUser) await m.auth.signInAnonymously(m.au);
    return m.au.currentUser;
  }
  const call = async (name, data) => { const m = await load(); return (await m.fn.httpsCallable(m.fx, name)(data)).data; };
  const fbErr = e => (e && (e.message || e.code)) || String(e);

  /* ---------- 제출 설정 ---------- */
  async function watchSettings(cb) {
    const m = await load();
    return m.fs.onSnapshot(m.fs.doc(m.db, "config", "submission"), s => cb(s.exists() ? s.data() : null), () => cb(undefined));
  }
  async function loadSettings() {
    const m = await load(), s = await m.fs.getDoc(m.fs.doc(m.db, "config", "submission")), c = await m.fs.getDoc(m.fs.doc(m.db, "config", "submissionSecret"));
    return { settings: s.exists() ? s.data() : { open: false, weeks: {} }, code: c.exists() ? c.data().code || "" : "" };
  }
  async function saveSettings(st, code) {
    const m = await load(), { doc, setDoc, Timestamp } = m.fs, o = { open: !!st.open, weeks: st.weeks || {}, hasCode: !!code, updatedBy: m.au.currentUser.email, updatedAt: Timestamp.now() };
    if (st.opensAt) o.opensAt = Timestamp.fromDate(new Date(st.opensAt));
    if (st.closesAt) o.closesAt = Timestamp.fromDate(new Date(st.closesAt));
    await setDoc(doc(m.db, "config", "submissionSecret"), { code: code || "" });
    await setDoc(doc(m.db, "config", "submission"), o);
  }

  /* ---------- 학생 ---------- */
  async function submitWeek(S, n, code) {
    const user = await anon(), m = await load(), { doc, setDoc, serverTimestamp } = m.fs, id = sid(S.student);
    const answers = {}; Object.keys(S.answers).forEach(k => { if (wkOf(k) === n) answers[k] = S.answers[k]; });
    const head = { student: { klass: S.student.klass || "", number: S.student.number || "", name: S.student.name }, uid: user.uid, updatedAt: serverTimestamp() };
    const body = { json: JSON.stringify(answers), updatedAt: serverTimestamp() };
    if (code) { head.code = code; body.code = code; }
    await setDoc(doc(m.db, "submissions", id), head);
    await setDoc(doc(m.db, "submissions", id, "weeks", String(n)), body);
    return Object.keys(answers).length;
  }
  async function fetchPublished(student) {
    await anon(); const m = await load(), { collection, getDocs } = m.fs, out = {};

  /* ---------- 교사 ---------- */
  async function signIn() {
    const m = await load(), p = new m.auth.GoogleAuthProvider();

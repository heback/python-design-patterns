<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
  /* 테마는 페이지 렌더 전에 적용해야 깜빡임이 없다. 저장소 접근이 막힌 환경도 고려. */
  try { var t = localStorage.getItem("dp-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body class="{{body_class}}" data-part="{{part}}">
<header class="topbar">
  <a class="brand" href="index.html">파이썬 디자인 패턴</a>
  <span class="crumb">{{crumb}}</span>
  <a class="glossary-link" href="glossary.html">용어집</a>
  <button class="theme-toggle" type="button" aria-label="밝기 모드 전환">◐</button>
</header>
<div class="layout">
  <nav class="side-toc" aria-label="이 장의 목차">{{toc}}</nav>
  <main class="content">
    {{hero}}
    {{content}}
    {{pager}}
  </main>
</div>
<footer class="foot">파이썬 디자인 패턴 · 모든 예제 코드는 <code>src/</code>에서 직접 실행할 수 있다.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script>
  /* 테마 전환: 시스템 설정 → 수동 선택 순으로 우선한다. */
  document.querySelector(".theme-toggle").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark"
                                  : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("dp-theme", root.dataset.theme); } catch (e) {}
  });
  /* 코드 블록 복사 버튼 */
  document.querySelectorAll("figure.code").forEach(function (fig) {
    var btn = document.createElement("button");
    btn.className = "copy"; btn.type = "button"; btn.textContent = "복사";
    btn.addEventListener("click", function () {
      navigator.clipboard.writeText(fig.querySelector("code").innerText).then(function () {
        btn.textContent = "복사됨"; setTimeout(function () { btn.textContent = "복사"; }, 1200);
      });
    });
    fig.querySelector("figcaption").appendChild(btn);
  });
</script>
</body>
</html>
